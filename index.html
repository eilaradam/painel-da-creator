<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel da Creator</title>
    <meta name="description" content="O painel que organiza a carreira de uma creator: marcas, propostas, entregas, conteúdo, números e dinheiro num lugar só.">
    <meta name="robots" content="noindex">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23C8441A'/><text y='72' x='50' text-anchor='middle' font-size='58' font-family='system-ui,sans-serif' font-weight='700' fill='white'>P</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="shell">

    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">P</div>
            <div>
                <div class="brand-name">Painel da Creator</div>
                <div class="brand-sub">seu negócio, organizado</div>
            </div>
        </div>

        <nav class="nav" id="nav" aria-label="Menu principal"></nav>

        <div class="sidebar-foot">
            <div class="me">
                <div class="me-avatar" id="meAvatar">C</div>
                <div style="min-width:0">
                    <div class="me-name" id="meNome">Sua conta</div>
                    <div class="me-handle" id="meArroba">preencha seus dados</div>
                </div>
            </div>
        </div>
    </aside>

    <div class="scrim" id="scrim"></div>

    <main class="main">
        <header class="topbar">
            <button class="menu-btn" id="menuBtn" type="button" aria-label="Abrir menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>
            <div>
                <div class="page-title" id="pageTitle">Início</div>
                <div class="page-hint" id="pageHint"></div>
            </div>
            <div class="topbar-actions" id="topbarActions"></div>
        </header>

        <div class="view" id="view"></div>
    </main>

</div>

<script src="js/ui.js"></script>
<script src="js/seed.js"></script>
<script src="js/biblioteca.js"></script>
<script src="js/store.js"></script>
<script src="js/views/inicio.js"></script>
<script src="js/views/marcas.js"></script>
<script src="js/views/propostas.js"></script>
<script src="js/views/entregas.js"></script>
<script src="js/views/financeiro.js"></script>
<script src="js/views/conteudo.js"></script>
<script src="js/views/numeros.js"></script>
<script src="js/views/checklist.js"></script>
<script src="js/views/mensagens.js"></script>
<script src="js/views/config.js"></script>
<script src="js/app.js"></script>

</body>
</html>
