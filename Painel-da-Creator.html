                    ${m.valor ? `<span class="card-money">${UI.brl(m.valor)}</span>` : ''}
                    ${prazo ? `<span class="pill ${prazo.tom ? 'pill-' + prazo.tom : ''}">${prazo.texto}</span>` : ''}
                </div>
            </article>`;
    }

    function taxaFechamento(marcas) {
        const decididas = marcas.filter(m => ['fechado', 'entregue', 'pago', 'perdida'].includes(m.status));
        if (!decididas.length) return 0;
        const ganhas = decididas.filter(m => m.status !== 'perdida').length;
        return Math.round((ganhas / decididas.length) * 100);
    }

    /* ---------- eventos ---------- */
    function ligar() {
        const busca = raiz.querySelector('#mBusca');
        busca.addEventListener('input', e => {
            filtro = e.target.value;
            const pos = e.target.selectionStart;
            desenhar();
            const novo = raiz.querySelector('#mBusca');
            novo.focus();
            novo.setSelectionRange(pos, pos);
        });

        raiz.querySelector('#mPerdidas').addEventListener('click', () => {
            verPerdidas = !verPerdidas;
            desenhar();
        });

        raiz.querySelector('#mNova').addEventListener('click', () => abrirFicha(null));

        raiz.querySelectorAll('.card[data-id]').forEach(card => {
            card.addEventListener('click', e => {
                if (card.classList.contains('dragging')) return;
                abrirFicha(card.dataset.id);
            });
            card.addEventListener('dragstart', e => {
                e.dataTransfer.setData('text/plain', card.dataset.id);
                e.dataTransfer.effectAllowed = 'move';
                setTimeout(() => card.classList.add('dragging'), 0);
            });
            card.addEventListener('dragend', () => card.classList.remove('dragging'));
        });

        raiz.querySelectorAll('[data-drop]').forEach(zona => {
            const col = zona.closest('.col');
            zona.addEventListener('dragover', e => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                col.classList.add('drop');
            });
            zona.addEventListener('dragleave', e => {
                if (!zona.contains(e.relatedTarget)) col.classList.remove('drop');
            });
            zona.addEventListener('drop', e => {
                e.preventDefault();
                col.classList.remove('drop');
                const id = e.dataTransfer.getData('text/plain');
                const marca = Store.find('marcas', id);
                if (!marca) return;
                const novo = zona.dataset.drop;
                if (marca.status === novo) return;
                Store.update('marcas', id, { status: novo });
                UI.toast(marca.nome + ' foi para "' + NOMES[novo] + '"');
                if (novo === 'pago') registrarPagamento(marca);
                desenhar();
                App.atualizarBadges();
            });
        });
    }

    /** quando a marca vira "pago", oferece lançar no financeiro */
    function registrarPagamento(marca) {
        const jaTem = Store.lista('lancamentos').some(l => l.marca === marca.nome && Number(l.valor) === Number(marca.valor) && l.status === 'recebido');
        if (jaTem || !marca.valor) return;
        Store.add('lancamentos', {
            tipo: 'entrada',
            desc: 'Trabalho para ' + marca.nome,
            marca: marca.nome,
            valor: Number(marca.valor),
            data: Store.dia(0),
            status: 'recebido',
            categoria: 'Publi'
        });
        UI.toast(UI.brl(marca.valor) + ' lançado no financeiro');
    }

    /* ---------- ficha da marca ---------- */
    function abrirFicha(id) {
        const m = id ? Store.find('marcas', id) : {
            nome: '', contato: '', email: '', instagram: '', nicho: '', status: 'contato',
            valor: '', origem: '', proximoPasso: '', prazoRetorno: '', obs: ''
        };
        const novo = !id;

        const corpo = `
            <div class="field-row">
                ${UI.campo('Nome da marca', UI.input('nome', m.nome, 'placeholder="Ex: Lumi Skincare"'))}
                ${UI.campo('Com quem você fala', UI.input('contato', m.contato, 'placeholder="Ex: Rafaela (marketing)"'))}
            </div>
            <div class="field-row">
                ${UI.campo('E-mail', UI.input('email', m.email, 'type="email" placeholder="contato@marca.com"'))}
                ${UI.campo('Instagram', UI.input('instagram', m.instagram, 'placeholder="@marca"'))}
            </div>
            <div class="field-row three">
                ${UI.campo('Etapa', UI.select('status', [...COLUNAS.map(c => ({ v: c.id, t: c.nome })), { v: 'perdida', t: 'Não rolou' }], m.status))}
                ${UI.campo('Valor em jogo', UI.input('valor', m.valor, 'type="number" min="0" step="50" placeholder="1800"'))}
                ${UI.campo('Nicho', UI.input('nicho', m.nicho, 'placeholder="Beleza"'))}
            </div>
            <div class="field-row">
                ${UI.campo('Como chegou até você', UI.select('origem', [
                    'Elas me chamaram no direct', 'Prospecção minha por e-mail', 'Prospecção minha no direct',
                    'Indicação', 'Agência', 'Plataforma de campanha', 'Outro'
                ], m.origem || 'Elas me chamaram no direct'))}
                ${UI.campo('Quando dar o próximo retorno', UI.input('prazoRetorno', m.prazoRetorno, 'type="date"'))}
            </div>
            ${UI.campo('Qual é o próximo passo', UI.input('proximoPasso', m.proximoPasso, 'placeholder="Ex: mandar a proposta com 2 opções"'),
                'Escreva sempre uma ação sua. É isso que vira sua lista do dia no Início.')}
            ${UI.campo('Anotações', UI.textarea('obs', m.obs, 'placeholder="O que ela pediu, o que não pode aparecer, prazo de pagamento..."'))}
        `;

        const rodape = `
            ${!novo ? `<button class="btn btn-danger" data-apagar type="button">${UI.icon('lixo', 15)} Apagar</button>` : ''}
            <div class="spacer"></div>
            <button class="btn" data-fechar type="button">Cancelar</button>
            <button class="btn btn-primary" data-salvar type="button">${novo ? 'Adicionar marca' : 'Salvar'}</button>`;

        UI.modal({
            titulo: novo ? 'Nova marca' : m.nome,
            sub: novo ? 'Toda conversa começa aqui, mesmo a que ainda é só um direct' : NOMES[m.status],
            corpo, rodape, largo: true,
            aoAbrir(o) {
                o.querySelector('[data-salvar]').addEventListener('click', () => {
                    const dados = UI.lerForm(o.querySelector('.modal-body'));
                    if (!dados.nome) { UI.toast('Escreve pelo menos o nome da marca', 'erro'); return; }
                    dados.valor = Number(dados.valor) || 0;
                    if (novo) Store.add('marcas', dados);
                    else Store.update('marcas', id, dados);
                    UI.fecharModal();
                    UI.toast(novo ? 'Marca adicionada' : 'Salvo');
                    desenhar();
                    App.atualizarBadges();
                });
                const apagar = o.querySelector('[data-apagar]');
                if (apagar) apagar.addEventListener('click', () => {
                    UI.fecharModal();
                    UI.confirmar({
                        titulo: 'Apagar ' + m.nome + '?',
                        texto: 'Some do funil e não dá pra desfazer.',
                        aoConfirmar() {
                            Store.remove('marcas', id);
                            UI.toast('Marca apagada');
                            desenhar();
                            App.atualizarBadges();
                        }
                    });
                });
            }
        });
    }

    return {
        titulo: 'Marcas',
        dica: 'Do primeiro oi até o dinheiro na conta',
        render,
        abrirFicha,
        COLUNAS, NOMES
    };
})();

</script>
<script>
/* js/views/propostas.js */
/* ==========================================================================
   Propostas · montar o orçamento e mandar pra marca sem travar no valor
   ========================================================================== */

window.Views = window.Views || {};

Views.propostas = (() => {

    const STATUS = {
        rascunho: { nome: 'Rascunho', pill: '' },
        enviada: { nome: 'Enviada', pill: 'pill-warn' },
        aprovada: { nome: 'Aprovada', pill: 'pill-ok' },
        recusada: { nome: 'Recusada', pill: 'pill-danger' }
    };

    let raiz = null;
    let itensTemp = [];

    const total = p => {
        const soma = (p.itens || []).reduce((s, i) => s + (Number(i.valor) || 0) * (Number(i.qtd) || 1), 0);
        return Math.max(0, soma - (Number(p.desconto) || 0));
    };

    function render(el) {
        raiz = el;
        desenhar();
    }

    function desenhar() {
        const props = Store.lista('propostas');
        const enviadas = props.filter(p => p.status === 'enviada');
        const aprovadas = props.filter(p => p.status === 'aprovada');
        const decididas = props.filter(p => ['aprovada', 'recusada'].includes(p.status));
        const taxa = decididas.length ? Math.round((aprovadas.length / decididas.length) * 100) : 0;
        const valorEnviado = enviadas.reduce((s, p) => s + total(p), 0);

        raiz.innerHTML = `
            <div class="stats stagger" style="margin-bottom:22px">
                <div class="stat">
                    <div class="stat-label">Esperando resposta</div>
                    <div class="stat-value">${enviadas.length}</div>
                    <div class="stat-foot">${UI.brl(valorEnviado)} aguardando um sim</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Aprovadas</div>
                    <div class="stat-value">${aprovadas.length}</div>
                    <div class="stat-foot">${UI.brl(aprovadas.reduce((s, p) => s + total(p), 0))} fechados</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Taxa de aprovação</div>
                    <div class="stat-value">${taxa}<small>%</small></div>
                    <div class="stat-foot">das propostas que tiveram resposta</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Ticket médio</div>
                    <div class="stat-value">${UI.brl(aprovadas.length ? aprovadas.reduce((s, p) => s + total(p), 0) / aprovadas.length : 0)}</div>
                    <div class="stat-foot">valor médio do que você fecha</div>
                </div>
            </div>

            <div class="toolbar">
                <div>
                    <h2 class="serif" style="font-size:19px">Suas propostas</h2>
                    <p style="margin:2px 0 0;font-size:13px;color:var(--soft)">Clique em uma para ver como a marca recebe.</p>
                </div>
                <div style="margin-left:auto"></div>
                <button class="btn" id="pTabela" type="button">${UI.icon('dinheiro', 15)} Minha tabela de preços</button>
                <button class="btn btn-primary" id="pNova" type="button">${UI.icon('mais')} Nova proposta</button>
            </div>

            <div class="panel">
                <div class="panel-body flush">
                    ${props.length ? `
                    <div class="table-wrap">
                        <table class="data">
                            <thead>
                                <tr>
                                    <th>Marca</th>
                                    <th>Proposta</th>
                                    <th>Situação</th>
                                    <th>Enviada</th>
                                    <th class="num">Valor</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                ${props.map(linha).join('')}
                            </tbody>
                        </table>
                    </div>` :
                    UI.vazio('Nenhuma proposta ainda',
                        'A proposta é o que separa a conversa do trabalho pago. Monte a primeira em dois minutos.',
                        '<button class="btn btn-primary" id="pVazio" type="button">Criar minha primeira proposta</button>')}
                </div>
            </div>
        `;

        ligar();
    }

    function linha(p) {
        const s = STATUS[p.status] || STATUS.rascunho;
        const dias = p.status === 'enviada' && p.enviadaEm ? Math.abs(UI.emDias(p.enviadaEm) || 0) : null;
        return `
            <tr class="clickable" data-ver="${p.id}">
                <td>
                    <div class="cell-title">${UI.esc(p.marcaNome || 'sem marca')}</div>
                    <div class="cell-sub">${(p.itens || []).length} ${(p.itens || []).length === 1 ? 'item' : 'itens'}</div>
                </td>
                <td>${UI.esc(p.titulo || '')}</td>
                <td><span class="pill ${s.pill}">${s.nome}</span></td>
                <td>
                    ${p.enviadaEm ? UI.data(p.enviadaEm) : '<span class="muted">não enviada</span>'}
                    ${dias !== null && dias >= 4 ? `<div class="cell-sub" style="color:var(--warn)">faz ${dias} dias, cobra</div>` : ''}
                </td>
                <td class="num"><b>${UI.brl(total(p))}</b></td>
                <td class="acts">
                    <button class="icon-btn" data-editar="${p.id}" title="Editar" type="button">${UI.icon('lapis', 15)}</button>
                </td>
            </tr>`;
    }

    function ligar() {
        const nova = raiz.querySelector('#pNova');
        if (nova) nova.addEventListener('click', () => editar(null));
        const vazio = raiz.querySelector('#pVazio');
        if (vazio) vazio.addEventListener('click', () => editar(null));
        raiz.querySelector('#pTabela').addEventListener('click', tabelaDePrecos);

        raiz.querySelectorAll('[data-ver]').forEach(tr => {
            tr.addEventListener('click', e => {
                if (e.target.closest('[data-editar]')) return;
                visualizar(tr.dataset.ver);
            });
        });
        raiz.querySelectorAll('[data-editar]').forEach(b => {
            b.addEventListener('click', e => { e.stopPropagation(); editar(b.dataset.editar); });
        });
    }

    /* ---------- tabela de preços dela ---------- */
    function tabelaDePrecos() {
        const c = Store.get().perfil.cache || {};
        UI.modal({
            titulo: 'Minha tabela de preços',
            sub: 'Isso vira sugestão automática quando você monta uma proposta',
            corpo: `
                <div class="field-row">
                    ${UI.campo('1 Reels', UI.input('reels', c.reels, 'type="number" min="0" step="50"'))}
                    ${UI.campo('Sequência de stories', UI.input('stories', c.stories, 'type="number" min="0" step="50"'))}
                </div>
                <div class="field-row">
                    ${UI.campo('Pacote de fotos', UI.input('foto', c.foto, 'type="number" min="0" step="50"'))}
                    ${UI.campo('Combo reels + stories', UI.input('combo', c.combo, 'type="number" min="0" step="50"'))}
                </div>
                <div class="field-row">
                    ${UI.campo('Exclusividade (% a mais)', UI.input('exclusividade', c.exclusividade, 'type="number" min="0" max="200"'),
                        'Quanto você cobra a mais pra não fechar com concorrente por um tempo')}
                    ${UI.campo('Permissão de anúncio (% a mais)', UI.input('permissaoAds', c.permissaoAds, 'type="number" min="0" max="200"'),
                        'A marca usar seu vídeo em anúncio pago é outro serviço. Cobre por isso.')}
                </div>
                <div class="note accent" style="margin-top:6px">
                    ${UI.icon('info')}
                    <div>Regra de bolso: some quanto custa o seu dia de trabalho (roteiro, gravação, edição) e some o valor de ceder a imagem. Se o número dá aperto no peito de tão baixo, ele está baixo.</div>
                </div>`,
            rodape: `<button class="btn" data-fechar type="button">Cancelar</button>
                     <button class="btn btn-primary" data-salvar type="button">Salvar tabela</button>`,
            aoAbrir(o) {
                o.querySelector('[data-salvar]').addEventListener('click', () => {
                    const d = UI.lerForm(o.querySelector('.modal-body'));
                    Store.setPerfil({
                        cache: {
                            reels: Number(d.reels) || 0, stories: Number(d.stories) || 0,
                            foto: Number(d.foto) || 0, combo: Number(d.combo) || 0,
                            exclusividade: Number(d.exclusividade) || 0, permissaoAds: Number(d.permissaoAds) || 0
                        }
                    });
                    UI.fecharModal();
                    UI.toast('Tabela salva');
                });
            }
        });
    }

    /* ---------- editor ---------- */
    function editar(id) {
        const p = id ? Store.find('propostas', id) : {
            marcaNome: '', titulo: '', status: 'rascunho', enviadaEm: '', validadeDias: 10, desconto: 0,
            itens: [], condicoes: 'Pagamento em até 15 dias após a entrega. Uma rodada de ajuste inclusa. O conteúdo é para uso orgânico no perfil da marca.', obs: ''
        };
        itensTemp = JSON.parse(JSON.stringify(p.itens || []));
        if (!itensTemp.length) itensTemp.push({ desc: '', qtd: 1, valor: '' });

        const marcas = Store.lista('marcas').map(m => m.nome).filter((v, i, a) => a.indexOf(v) === i);

        UI.modal({
            titulo: id ? 'Editar proposta' : 'Nova proposta',
            sub: 'Descreva a entrega como a marca entende, não como você chama internamente',
            largo: true,
            corpo: `
                <div class="field-row">
                    ${UI.campo('Marca', `<input class="input" name="marcaNome" list="listaMarcas" value="${UI.esc(p.marcaNome)}" placeholder="Ex: Casa Nova Decor">
                        <datalist id="listaMarcas">${marcas.map(m => `<option value="${UI.esc(m)}">`).join('')}</datalist>`)}
                    ${UI.campo('Nome da proposta', UI.input('titulo', p.titulo, 'placeholder="Ex: Campanha de setembro"'))}
                </div>

                <div class="label" style="margin-top:6px">O que você entrega</div>
                <div id="pItens" style="display:flex;flex-direction:column;gap:9px;margin-bottom:10px"></div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px">
                    <button class="btn btn-sm" data-add type="button">${UI.icon('mais', 14)} Adicionar item</button>
                    ${sugestoes()}
                </div>

                <div class="field-row three">
                    ${UI.campo('Situação', UI.select('status', Object.keys(STATUS).map(k => ({ v: k, t: STATUS[k].nome })), p.status))}
                    ${UI.campo('Enviada em', UI.input('enviadaEm', p.enviadaEm, 'type="date"'))}
                    ${UI.campo('Desconto (R$)', UI.input('desconto', p.desconto, 'type="number" min="0" step="50"'))}
                </div>
                ${UI.campo('Condições', UI.textarea('condicoes', p.condicoes, 'style="min-height:80px"'),
                    'Prazo de pagamento, rodadas de ajuste e onde o conteúdo pode ser usado. É isso que evita briga depois.')}
                ${UI.campo('Anotação sua (a marca não vê)', UI.input('obs', p.obs))}

                <div style="display:flex;align-items:baseline;gap:10px;padding:15px 0 0;border-top:1px solid var(--border)">
                    <span class="eyebrow">Total da proposta</span>
                    <span class="serif" id="pTotal" style="margin-left:auto;font-size:24px;letter-spacing:-0.02em"></span>
                </div>`,
            rodape: `
                ${id ? `<button class="btn btn-danger" data-apagar type="button">${UI.icon('lixo', 15)} Apagar</button>` : ''}
                <div class="spacer"></div>
                <button class="btn" data-fechar type="button">Cancelar</button>
                <button class="btn btn-primary" data-salvar type="button">${id ? 'Salvar' : 'Criar proposta'}</button>`,
            aoAbrir(o) {
                desenharItens(o);

                o.querySelector('[data-add]').addEventListener('click', () => {
                    itensTemp.push({ desc: '', qtd: 1, valor: '' });
                    desenharItens(o);
                });

                o.querySelectorAll('[data-sug]').forEach(b => {
                    b.addEventListener('click', () => {
                        const [desc, valor] = b.dataset.sug.split('|');
                        const vazioIdx = itensTemp.findIndex(i => !i.desc && !i.valor);
                        const item = { desc, qtd: 1, valor: Number(valor) };
                        if (vazioIdx > -1) itensTemp[vazioIdx] = item; else itensTemp.push(item);
                        desenharItens(o);
                    });
                });

                o.querySelector('[data-salvar]').addEventListener('click', () => {
                    lerItens(o);
                    const d = UI.lerForm(o.querySelector('.modal-body'));
                    if (!d.marcaNome) { UI.toast('Diz pra qual marca é essa proposta', 'erro'); return; }
                    const dados = {
                        marcaNome: d.marcaNome, titulo: d.titulo, status: d.status,
                        enviadaEm: d.enviadaEm, desconto: Number(d.desconto) || 0,
                        condicoes: d.condicoes, obs: d.obs,
                        itens: itensTemp.filter(i => i.desc).map(i => ({ desc: i.desc, qtd: Number(i.qtd) || 1, valor: Number(i.valor) || 0 }))
                    };
                    if (dados.status === 'enviada' && !dados.enviadaEm) dados.enviadaEm = Store.dia(0);
                    if (id) Store.update('propostas', id, dados);
                    else Store.add('propostas', dados);
                    UI.fecharModal();
                    UI.toast(id ? 'Proposta salva' : 'Proposta criada');
                    desenhar();
                    App.atualizarBadges();
                });

                const apagar = o.querySelector('[data-apagar]');
                if (apagar) apagar.addEventListener('click', () => {
                    UI.fecharModal();
                    UI.confirmar({
                        titulo: 'Apagar essa proposta?',
                        texto: 'Não dá pra desfazer.',
                        aoConfirmar() { Store.remove('propostas', id); desenhar(); UI.toast('Apagada'); }
                    });
                });

                o.addEventListener('input', e => {
                    if (e.target.name === 'desconto' || e.target.closest('#pItens')) {
                        lerItens(o);
                        atualizarTotal(o);
                    }
                });
            }
        });
    }

    function sugestoes() {
        const c = Store.get().perfil.cache || {};
        const lista = [
            { t: 'Reels', d: '1 Reels roteirizado, gravado e editado', v: c.reels },
            { t: 'Stories', d: 'Sequência de 3 stories com link', v: c.stories },
            { t: 'Fotos', d: 'Pacote de 3 fotos editadas', v: c.foto },
            { t: 'Anúncio', d: 'Permissão de anúncio por 60 dias', v: Math.round((c.reels || 0) * ((c.permissaoAds || 0) / 100)) }
        ].filter(i => i.v > 0);
        if (!lista.length) return '';
        return lista.map(i => `<button class="chip" data-sug="${UI.esc(i.d)}|${i.v}" type="button">+ ${i.t} · ${UI.brl(i.v)}</button>`).join('');
    }

    function desenharItens(o) {
        const box = o.querySelector('#pItens');
        box.innerHTML = itensTemp.map((i, idx) => `
            <div style="display:grid;grid-template-columns:minmax(0,1fr) 110px 34px;gap:8px;align-items:center">
                <input class="input" data-i="${idx}" data-campo="desc" value="${UI.esc(i.desc)}" placeholder="Ex: 1 Reels gravado no seu espaço">
                <input class="input" data-i="${idx}" data-campo="valor" type="number" min="0" step="50" value="${UI.esc(i.valor)}" placeholder="R$">
                <button class="icon-btn" data-remover="${idx}" type="button" title="Remover">${UI.icon('x', 15)}</button>
            </div>`).join('');

        box.querySelectorAll('[data-remover]').forEach(b => {
            b.addEventListener('click', () => {
                itensTemp.splice(Number(b.dataset.remover), 1);
                if (!itensTemp.length) itensTemp.push({ desc: '', qtd: 1, valor: '' });
                desenharItens(o);
                atualizarTotal(o);
            });
        });
        atualizarTotal(o);
    }

    function lerItens(o) {
        o.querySelectorAll('#pItens [data-i]').forEach(el => {
            const i = Number(el.dataset.i);
            if (itensTemp[i]) itensTemp[i][el.dataset.campo] = el.value;
        });
    }

    function atualizarTotal(o) {
        const desconto = Number((o.querySelector('[name=desconto]') || {}).value) || 0;
        const soma = itensTemp.reduce((s, i) => s + (Number(i.valor) || 0), 0);
        o.querySelector('#pTotal').textContent = UI.brl(Math.max(0, soma - desconto));
    }

    /* ---------- como a marca vê ---------- */
    function visualizar(id) {
        const p = Store.find('propostas', id);
        if (!p) return;
        const perfil = Store.get().perfil;
        const soma = (p.itens || []).reduce((s, i) => s + Number(i.valor || 0), 0);

        UI.modal({
            titulo: 'Proposta para ' + (p.marcaNome || ''),
            sub: 'É assim que a marca recebe',
            largo: true,
            corpo: `
                <div id="pImprimir" style="background:var(--surface);padding:6px 2px">
                    <div style="display:flex;align-items:flex-start;gap:14px;padding-bottom:18px;border-bottom:2px solid var(--ink)">
                        <div>
                            <div class="serif" style="font-size:24px;letter-spacing:-0.02em">${UI.esc(perfil.nome || 'Seu nome')}</div>
                            <div style="font-size:13px;color:var(--soft);margin-top:2px">${UI.esc(perfil.arroba || '')} · ${UI.compacto(perfil.seguidores)} seguidores</div>
                        </div>
                        <div style="margin-left:auto;text-align:right;font-size:12.5px;color:var(--soft);line-height:1.6">
                            ${UI.esc(perfil.email || '')}<br>${UI.esc(perfil.whatsapp || '')}
                        </div>
                    </div>

                    <div style="padding:20px 0 4px">
                        <div class="eyebrow">Proposta comercial</div>
                        <h3 class="serif" style="font-size:20px;margin-top:5px">${UI.esc(p.titulo || 'Parceria')}</h3>
                        <p style="margin:4px 0 0;font-size:13.5px;color:var(--soft)">Para ${UI.esc(p.marcaNome)} · ${UI.data(p.enviadaEm || Store.dia(0), 'longo')}</p>
                    </div>

                    <table class="data" style="margin:18px 0">
                        <thead><tr><th>Entrega</th><th class="num">Valor</th></tr></thead>
                        <tbody>
                            ${(p.itens || []).map(i => `
                                <tr><td>${UI.esc(i.desc)}</td><td class="num">${UI.brlExato(i.valor)}</td></tr>`).join('')}
                            ${p.desconto ? `<tr><td style="color:var(--ok)">Desconto pelo pacote fechado</td><td class="num" style="color:var(--ok)">- ${UI.brlExato(p.desconto)}</td></tr>` : ''}
                            <tr>
                                <td style="font-weight:700;font-size:15px">Total</td>
                                <td class="num serif" style="font-size:19px">${UI.brlExato(Math.max(0, soma - (Number(p.desconto) || 0)))}</td>
                            </tr>
                        </tbody>
                    </table>

                    ${p.condicoes ? `
                        <div style="margin-top:16px">
                            <div class="eyebrow" style="margin-bottom:7px">Condições</div>
                            <p style="margin:0;font-size:13.5px;line-height:1.65;color:var(--soft);white-space:pre-wrap">${UI.esc(p.condicoes)}</p>
                        </div>` : ''}

                    <p style="margin:22px 0 0;font-size:13px;color:var(--muted)">
                        Proposta válida por ${p.validadeDias || 10} dias. Qualquer ajuste, é só me chamar.
                    </p>
                </div>`,
            rodape: `
                <button class="btn" data-copiar type="button">${UI.icon('copiar', 15)} Copiar em texto</button>
                <div class="spacer"></div>
                <button class="btn" data-imprimir type="button">${UI.icon('imprimir', 15)} Salvar em PDF</button>
                <button class="btn btn-primary" data-editar type="button">Editar</button>`,
            aoAbrir(o) {
                o.querySelector('[data-editar]').addEventListener('click', () => { UI.fecharModal(); editar(id); });
                o.querySelector('[data-imprimir]').addEventListener('click', () => imprimir(o.querySelector('#pImprimir').innerHTML));
                o.querySelector('[data-copiar]').addEventListener('click', () => UI.copiar(emTexto(p, perfil), 'Proposta copiada, é só colar no e-mail'));
            }
        });
    }

    function emTexto(p, perfil) {
        const soma = (p.itens || []).reduce((s, i) => s + Number(i.valor || 0), 0);
        const linhas = [
            `PROPOSTA · ${p.titulo || 'Parceria'}`,
            `Para: ${p.marcaNome}`,
            `De: ${perfil.nome} (${perfil.arroba})`,
            '',
            'O QUE EU ENTREGO:'
        ];
        (p.itens || []).forEach(i => linhas.push(`· ${i.desc} ... ${UI.brlExato(i.valor)}`));
        if (p.desconto) linhas.push(`· Desconto pelo pacote ... - ${UI.brlExato(p.desconto)}`);
        linhas.push('', `TOTAL: ${UI.brlExato(Math.max(0, soma - (Number(p.desconto) || 0)))}`);
        if (p.condicoes) linhas.push('', 'CONDIÇÕES:', p.condicoes);
        linhas.push('', `Proposta válida por ${p.validadeDias || 10} dias.`, `${perfil.email || ''} · ${perfil.whatsapp || ''}`);
        return linhas.join('\n');
    }

    function imprimir(html) {
        const j = window.open('', '_blank', 'width=820,height=900');
        if (!j) { UI.toast('Libere os pop-ups pra salvar em PDF', 'erro'); return; }

        // leva junto o estilo desta página, seja ele um arquivo ou embutido.
        // sem isso a proposta sai sem formatação quando o painel roda como arquivo único.
        const estilos = Array.from(document.querySelectorAll('style'))
            .map(s => s.outerHTML)
            .concat(Array.from(document.querySelectorAll('link[rel="stylesheet"]'))
                .map(l => `<link rel="stylesheet" href="${l.href}">`))
            .join('\n');

        j.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Proposta</title>
            ${estilos}
            <style>body{padding:44px;background:#fff;max-width:760px;margin:0 auto}</style>
            </head><body>${html}</body></html>`);
        j.document.close();
        setTimeout(() => j.print(), 700);
    }

    return {
        titulo: 'Propostas',
        dica: 'Monte o orçamento e mande sem medo',
        render
    };
})();

</script>
<script>
/* js/views/entregas.js */
/* ==========================================================================
   Entregas · o que você prometeu, pra quem e até quando
   ========================================================================== */

window.Views = window.Views || {};

Views.entregas = (() => {

    const ETAPAS = ['roteiro', 'gravar', 'editar', 'enviado', 'aprovado'];
    const NOMES = {
        roteiro: 'Escrevendo o roteiro',
        gravar: 'A gravar',
        editar: 'Editando',
        enviado: 'Enviado, aguardando',
        aprovado: 'Aprovado'
    };
    const FORMATOS = ['Reels', 'Stories', 'Carrossel', 'Foto', 'TikTok', 'Vídeo para anúncio', 'Outro'];

    let raiz = null;

    function render(el) {
        raiz = el;
        desenhar();
    }

    function desenhar() {
        const todas = Store.lista('entregas');
        const abertas = todas.filter(e => e.status !== 'aprovado');
        const prontas = todas.filter(e => e.status === 'aprovado');

        const atrasadas = abertas.filter(e => (UI.emDias(e.prazo) ?? 99) < 0);
        const semana = abertas.filter(e => { const d = UI.emDias(e.prazo); return d !== null && d >= 0 && d <= 7; });
        const depois = abertas.filter(e => { const d = UI.emDias(e.prazo); return d === null || d > 7; });

        const valorAberto = abertas.reduce((s, e) => s + Number(e.valor || 0), 0);

        raiz.innerHTML = `
            <div class="stats stagger" style="margin-bottom:22px">
                <div class="stat">
                    <div class="stat-label">Em produção</div>
                    <div class="stat-value">${abertas.length}</div>
                    <div class="stat-foot">${UI.brl(valorAberto)} em trabalho a entregar</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Atrasadas</div>
                    <div class="stat-value" ${atrasadas.length ? 'style="color:var(--danger)"' : ''}>${atrasadas.length}</div>
                    <div class="stat-foot">${atrasadas.length ? 'avise a marca hoje, atraso sem aviso queima' : 'nenhuma, você está em dia'}</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Vencem em 7 dias</div>
                    <div class="stat-value">${semana.length}</div>
                    <div class="stat-foot">planeje as gravações</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Entregues e aprovadas</div>
                    <div class="stat-value">${prontas.length}</div>
                    <div class="stat-foot">viram case no seu portfólio</div>
                </div>
            </div>

            <div class="toolbar">
                <div>
                    <h2 class="serif" style="font-size:19px">Sua produção</h2>
                    <p style="margin:2px 0 0;font-size:13px;color:var(--soft)">Clique em qualquer entrega pra ver o briefing.</p>
                </div>
                <div style="margin-left:auto"></div>
                <button class="btn btn-primary" id="eNova" type="button">${UI.icon('mais')} Nova entrega</button>
            </div>

            ${grupo('Atrasadas', atrasadas, 'danger')}
            ${grupo('Essa semana', semana, 'warn')}
            ${grupo('Mais pra frente', depois, '')}
            ${grupo('Entregues e aprovadas', prontas, 'ok', true)}

            ${!todas.length ? UI.vazio('Nenhuma entrega cadastrada',
                'Toda vez que fechar com uma marca, quebre o combinado em entregas com prazo. É o que evita virar a noite editando.',
                '<button class="btn btn-primary" id="eVazio" type="button">Cadastrar a primeira</button>') : ''}
        `;

        ligar();
    }

    function grupo(titulo, itens, tom, recolhido) {
        if (!itens.length) return '';
        return `
            <section class="section">
                <div class="section-head">
                    <div style="display:flex;align-items:center;gap:9px">
                        <h2>${titulo}</h2>
                        <span class="pill ${tom ? 'pill-' + tom : ''}">${itens.length}</span>
                    </div>
                </div>
                <div class="panel">
                    <div class="panel-body flush">
                        <div class="table-wrap">
                            <table class="data">
                                <thead>
                                    <tr>
                                        <th>Entrega</th>
                                        <th>Marca</th>
                                        <th style="width:210px">Em que pé está</th>
                                        <th>Prazo</th>
                                        <th class="num">Valor</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody>${itens.map(l => linha(l, recolhido)).join('')}</tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>`;
    }

    function linha(e, concluida) {
        const t = UI.prazoTexto(e.prazo);
        const passo = ETAPAS.indexOf(e.status);
        return `
            <tr class="clickable" data-ver="${e.id}">
                <td>
                    <div class="cell-title">${UI.esc(e.titulo)}</div>
                    <div class="cell-sub">${UI.esc(e.formato || '')}</div>
                </td>
                <td>${UI.esc(e.marcaNome || '')}</td>
                <td>
                    ${concluida ? '<span class="pill pill-ok">Aprovado</span>' : `
                        <div style="display:flex;align-items:center;gap:8px">
                            <div class="progress" style="flex:1;min-width:60px"><span style="width:${((passo + 1) / ETAPAS.length) * 100}%"></span></div>
                            <span style="font-size:12px;color:var(--soft);white-space:nowrap">${NOMES[e.status] || e.status}</span>
                        </div>`}
                </td>
                <td>
                    ${UI.data(e.prazo)}
                    ${!concluida && t.tom ? `<div class="cell-sub" style="color:var(--${t.tom})">${t.texto}</div>` : ''}
                </td>
                <td class="num">${e.valor ? UI.brl(e.valor) : ''}</td>
                <td class="acts">
                    ${!concluida && passo < ETAPAS.length - 1 ?
                        `<button class="btn btn-sm" data-avancar="${e.id}" type="button" title="Passar pra próxima etapa">${NOMES[ETAPAS[passo + 1]].split(',')[0]} ${UI.icon('setaDir', 13)}</button>` : ''}
                </td>
            </tr>`;
    }

    function ligar() {
        const nova = raiz.querySelector('#eNova');
        if (nova) nova.addEventListener('click', () => editar(null));
        const vazio = raiz.querySelector('#eVazio');
        if (vazio) vazio.addEventListener('click', () => editar(null));

        raiz.querySelectorAll('[data-ver]').forEach(tr => {
            tr.addEventListener('click', e => {
                if (e.target.closest('[data-avancar]')) return;
                editar(tr.dataset.ver);
            });
        });

        raiz.querySelectorAll('[data-avancar]').forEach(b => {
            b.addEventListener('click', e => {
                e.stopPropagation();
                const item = Store.find('entregas', b.dataset.avancar);
                const prox = ETAPAS[ETAPAS.indexOf(item.status) + 1];
                Store.update('entregas', item.id, { status: prox });
                UI.toast(item.titulo + ': ' + NOMES[prox].toLowerCase());
                desenhar();
                App.atualizarBadges();
            });
        });
    }

    function editar(id) {
        const e = id ? Store.find('entregas', id) : {
            marcaNome: '', titulo: '', formato: 'Reels', prazo: Store.dia(7), status: 'roteiro', valor: '', link: '', brief: ''
        };
        const marcas = Store.lista('marcas').map(m => m.nome).filter((v, i, a) => a.indexOf(v) === i);

        UI.modal({
            titulo: id ? e.titulo : 'Nova entrega',
            sub: id ? e.marcaNome : 'Quebre o combinado em pedaços com prazo',
            largo: true,
            corpo: `
                <div class="field-row">
                    ${UI.campo('Marca', `<input class="input" name="marcaNome" list="listaMarcasE" value="${UI.esc(e.marcaNome)}" placeholder="Ex: Aurora Home">
                        <datalist id="listaMarcasE">${marcas.map(m => `<option value="${UI.esc(m)}">`).join('')}</datalist>`)}
                    ${UI.campo('O que é', UI.input('titulo', e.titulo, 'placeholder="Ex: Reels da sala decorada"'))}
                </div>
                <div class="field-row three">
                    ${UI.campo('Formato', UI.select('formato', FORMATOS, e.formato))}
                    ${UI.campo('Prazo', UI.input('prazo', e.prazo, 'type="date"'))}
                    ${UI.campo('Valor', UI.input('valor', e.valor, 'type="number" min="0" step="50"'))}
                </div>
                ${UI.campo('Em que pé está', UI.select('status', ETAPAS.map(k => ({ v: k, t: NOMES[k] })), e.status))}
                ${UI.campo('Briefing (o que a marca pediu)', UI.textarea('brief', e.brief, 'placeholder="O que precisa aparecer, o que NÃO pode aparecer, tom do vídeo, prazo de aprovação..."'),
                    'Copie aqui o que a marca escreveu. Na hora de gravar você não vai querer caçar isso no e-mail.')}
                ${UI.campo('Link do que foi entregue', UI.input('link', e.link, 'placeholder="https://..."'))}`,
            rodape: `
                ${id ? `<button class="btn btn-danger" data-apagar type="button">${UI.icon('lixo', 15)} Apagar</button>` : ''}
                <div class="spacer"></div>
                <button class="btn" data-fechar type="button">Cancelar</button>
                <button class="btn btn-primary" data-salvar type="button">${id ? 'Salvar' : 'Adicionar'}</button>`,
            aoAbrir(o) {
                o.querySelector('[data-salvar]').addEventListener('click', () => {
                    const d = UI.lerForm(o.querySelector('.modal-body'));
                    if (!d.titulo) { UI.toast('Dá um nome pra essa entrega', 'erro'); return; }
                    d.valor = Number(d.valor) || 0;
                    if (id) Store.update('entregas', id, d);
                    else Store.add('entregas', d);
                    UI.fecharModal();
                    UI.toast(id ? 'Salvo' : 'Entrega cadastrada');
                    desenhar();
                    App.atualizarBadges();
                });
                const apagar = o.querySelector('[data-apagar]');
                if (apagar) apagar.addEventListener('click', () => {
                    UI.fecharModal();
                    UI.confirmar({
                        titulo: 'Apagar essa entrega?',
                        texto: 'Não dá pra desfazer.',
                        aoConfirmar() { Store.remove('entregas', id); desenhar(); App.atualizarBadges(); UI.toast('Apagada'); }
                    });
                });
            }
        });
    }

    return {
        titulo: 'Entregas',
        dica: 'O que você prometeu e até quando',
        render
    };
})();

</script>
<script>
/* js/views/financeiro.js */
/* ==========================================================================
   Financeiro · quanto entrou, quanto vai entrar e quanto sobrou
   ========================================================================== */

window.Views = window.Views || {};

Views.financeiro = (() => {

    const CATEGORIAS_ENTRADA = ['Publi', 'UGC', 'Afiliado', 'Permuta com cachê', 'Consultoria', 'Outro'];
    const CATEGORIAS_SAIDA = ['Equipamento', 'Ferramenta', 'Terceiros', 'Deslocamento', 'Produto para gravar', 'Imposto', 'Outro'];

    let raiz = null;
    let filtro = 'tudo';

    function render(el) {
        raiz = el;
        desenhar();
    }

    function desenhar() {
        const lanc = Store.lista('lancamentos').slice().sort((a, b) => String(b.data).localeCompare(String(a.data)));
        const mesAtual = Store.mes(0);
        const noMes = l => String(l.data || '').slice(0, 7) === mesAtual;

        const recebido = soma(lanc.filter(l => l.tipo === 'entrada' && l.status === 'recebido' && noMes(l)));
        const aReceber = soma(lanc.filter(l => l.tipo === 'entrada' && l.status === 'previsto'));
        const gastos = soma(lanc.filter(l => l.tipo === 'saida' && noMes(l)));
        const sobrou = recebido - gastos;

        const meta = Number(Store.get().perfil.metaMes) || 0;
        const pct = meta ? Math.min(100, Math.round((recebido / meta) * 100)) : 0;
        const faltam = Math.max(0, meta - recebido);

        const atrasados = lanc.filter(l => l.tipo === 'entrada' && l.status === 'previsto' && (UI.emDias(l.data) ?? 99) < 0);

        const visiveis = lanc.filter(l => {
            if (filtro === 'entradas') return l.tipo === 'entrada';
            if (filtro === 'saidas') return l.tipo === 'saida';
            if (filtro === 'previstos') return l.status === 'previsto';
            return true;
        });

        raiz.innerHTML = `
            <div class="stats stagger" style="margin-bottom:22px">
                <div class="stat">
                    <div class="stat-label">Recebido em ${UI.MESES[new Date().getMonth()]}</div>
                    <div class="stat-value">${UI.brl(recebido)}</div>
                    <div class="stat-foot">
                        ${meta ? `<div class="progress" style="margin:7px 0 5px"><span style="width:${pct}%"></span></div>
                        ${pct}% da meta de ${UI.brl(meta)}` : 'defina sua meta nas configurações'}
                    </div>
                </div>
                <div class="stat">
                    <div class="stat-label">A receber</div>
                    <div class="stat-value">${UI.brl(aReceber)}</div>
                    <div class="stat-foot">${atrasados.length ? `<span class="down">${atrasados.length} ${atrasados.length === 1 ? 'pagamento atrasado' : 'pagamentos atrasados'}</span>` : 'nenhum atrasado'}</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Gastos do mês</div>
                    <div class="stat-value">${UI.brl(gastos)}</div>
                    <div class="stat-foot">equipamento, edição, deslocamento</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Sobrou de verdade</div>
                    <div class="stat-value" style="color:${sobrou >= 0 ? 'var(--ok)' : 'var(--danger)'}">${UI.brl(sobrou)}</div>
                    <div class="stat-foot">recebido menos gastos</div>
                </div>
            </div>

            ${meta && faltam > 0 ? `
                <div class="note accent" style="margin-bottom:20px">
                    ${UI.icon('raio')}
                    <div><b>Faltam ${UI.brl(faltam)} pra bater a meta do mês.</b> ${sugestaoMeta(faltam)}</div>
                </div>` : ''}
            ${atrasados.length ? `
                <div class="note" style="margin-bottom:20px">
                    ${UI.icon('alerta')}
                    <div><b>${UI.brl(soma(atrasados))} estão atrasados.</b> ${UI.esc(atrasados.map(l => l.marca || l.desc).join(', '))}.
                    Tem modelo pronto de cobrança educada na aba Mensagens.</div>
                </div>` : ''}

            <div class="grid g2" style="align-items:start;margin-bottom:22px">
                <section class="panel">
                    <div class="panel-head"><h3>Entradas por mês</h3></div>
                    <div class="panel-body">${grafico(lanc)}</div>
                </section>
                <section class="panel">
                    <div class="panel-head"><h3>De onde vem seu dinheiro</h3></div>
                    <div class="panel-body">${porCategoria(lanc)}</div>
                </section>
            </div>

            <div class="toolbar">
                <div class="chips">
                    ${[['tudo', 'Tudo'], ['entradas', 'Entradas'], ['saidas', 'Saídas'], ['previstos', 'A receber']].map(([v, t]) =>
                        `<button class="chip${filtro === v ? ' on' : ''}" data-filtro="${v}" type="button">${t}</button>`).join('')}
                </div>
                <div style="margin-left:auto"></div>
                <button class="btn" id="fSaida" type="button">${UI.icon('mais', 15)} Gasto</button>
                <button class="btn btn-primary" id="fEntrada" type="button">${UI.icon('mais', 15)} Entrada</button>
            </div>

            <div class="panel">
                <div class="panel-body flush">
                    ${visiveis.length ? `
                    <div class="table-wrap">
                        <table class="data">
                            <thead>
                                <tr>
                                    <th>Descrição</th>
                                    <th>Marca</th>
                                    <th>Categoria</th>
                                    <th>Data</th>
                                    <th>Situação</th>
                                    <th class="num">Valor</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>${visiveis.map(linha).join('')}</tbody>
                        </table>
                    </div>` : UI.vazio('Nada lançado ainda',
                        'Anote toda entrada e todo gasto. Sem isso você acha que ganhou bem e no fim do mês não sobra nada.')}
                </div>
            </div>
        `;
        ligar();
    }

    const soma = arr => arr.reduce((s, l) => s + Number(l.valor || 0), 0);

    function sugestaoMeta(faltam) {
        const c = Store.get().perfil.cache || {};
        const reels = Number(c.reels) || 0;
        if (!reels) return 'Cadastre sua tabela de preços pra eu te dizer quantos trabalhos faltam.';
        const n = Math.ceil(faltam / reels);
        return `Isso é ${n} ${n === 1 ? 'reels' : 'reels'} no seu valor de ${UI.brl(reels)}. Quantas marcas você ainda não chamou este mês?`;
    }

    function linha(l) {
        const entrada = l.tipo === 'entrada';
        const atrasado = entrada && l.status === 'previsto' && (UI.emDias(l.data) ?? 99) < 0;
        return `
            <tr class="clickable" data-editar="${l.id}">
                <td>
                    <div class="cell-title">${UI.esc(l.desc)}</div>
                </td>
                <td>${UI.esc(l.marca || '')}</td>
                <td><span class="pill">${UI.esc(l.categoria || '')}</span></td>
                <td>${UI.data(l.data)}</td>
                <td>
                    ${l.status === 'recebido'
                        ? `<span class="pill pill-ok">${entrada ? 'Recebido' : 'Pago'}</span>`
                        : `<span class="pill ${atrasado ? 'pill-danger' : 'pill-warn'}">${atrasado ? 'Atrasado' : 'Previsto'}</span>`}
                </td>
                <td class="num" style="color:${entrada ? 'var(--ink)' : 'var(--danger)'}">
                    <b>${entrada ? '' : '- '}${UI.brl(l.valor)}</b>
                </td>
                <td class="acts">
                    ${entrada && l.status === 'previsto'
                        ? `<button class="btn btn-sm" data-receber="${l.id}" type="button">${UI.icon('check', 13)} Recebi</button>` : ''}
                </td>
            </tr>`;
    }

    function grafico(lanc) {
        const meses = [];
        for (let i = 5; i >= 0; i--) meses.push(Store.mes(-i));
        const itens = meses.map(m => {
            const total = soma(lanc.filter(l => l.tipo === 'entrada' && l.status === 'recebido' && String(l.data || '').slice(0, 7) === m));
            return { rotulo: UI.MESES_CURTO[Number(m.split('-')[1]) - 1], valor: total, suave: m === Store.mes(0) };
        });
        if (!itens.some(i => i.valor)) return UI.vazio('Sem histórico', 'Assim que você marcar a primeira entrada como recebida, o gráfico aparece.');

        const comValor = itens.filter(i => i.valor > 0 && !i.suave);
        const media = comValor.length ? soma(comValor.map(i => ({ valor: i.valor }))) / comValor.length : 0;
        return UI.barras(itens) +
            (media ? `<p style="margin:14px 0 0;font-size:13px;color:var(--soft)">
                Sua média nos meses fechados é <b>${UI.brl(media)}</b>. É esse o número que você precisa bater todo mês pra viver disso.
            </p>` : '');
    }

    function porCategoria(lanc) {
        const entradas = lanc.filter(l => l.tipo === 'entrada' && l.status === 'recebido');
        if (!entradas.length) return UI.vazio('Sem entrada registrada', 'Aqui você vê qual tipo de trabalho te paga melhor.');
        const conta = {};
        entradas.forEach(l => {
            const k = l.categoria || 'Outro';
            conta[k] = (conta[k] || 0) + Number(l.valor || 0);
        });
        const total = Object.values(conta).reduce((a, b) => a + b, 0);
        const ordenado = Object.entries(conta).sort((a, b) => b[1] - a[1]);

        const porMarca = {};
        entradas.forEach(l => { if (l.marca) porMarca[l.marca] = (porMarca[l.marca] || 0) + Number(l.valor || 0); });
        const topMarca = Object.entries(porMarca).sort((a, b) => b[1] - a[1])[0];

        return `
            <div style="display:flex;flex-direction:column;gap:12px">
                ${ordenado.map(([cat, v]) => `
                    <div>
                        <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:5px">
                            <span style="font-size:13.5px;font-weight:600">${UI.esc(cat)}</span>
                            <span style="margin-left:auto;font-size:12px;color:var(--muted)" class="mono">${Math.round((v / total) * 100)}%</span>
                            <span class="mono" style="font-size:13px;font-weight:500">${UI.brl(v)}</span>
                        </div>
                        <div class="progress"><span style="width:${(v / total) * 100}%"></span></div>
                    </div>`).join('')}
            </div>
            ${topMarca ? `<p style="margin:16px 0 0;font-size:13px;color:var(--soft);line-height:1.55">
                <b>${UI.esc(topMarca[0])}</b> é sua maior fonte de renda, com ${UI.brl(topMarca[1])}.
                ${(topMarca[1] / total) > 0.5 ? 'Cuidado: mais da metade do seu faturamento depende de uma marca só. Vale prospectar outras.' : 'Sua renda está bem distribuída, isso é saudável.'}
            </p>` : ''}`;
    }

    function ligar() {
        raiz.querySelectorAll('[data-filtro]').forEach(b => {
            b.addEventListener('click', () => { filtro = b.dataset.filtro; desenhar(); });
        });
        raiz.querySelector('#fEntrada').addEventListener('click', () => editar(null, 'entrada'));
        raiz.querySelector('#fSaida').addEventListener('click', () => editar(null, 'saida'));

        raiz.querySelectorAll('[data-editar]').forEach(tr => {
            tr.addEventListener('click', e => {
                if (e.target.closest('[data-receber]')) return;
                editar(tr.dataset.editar);
            });
        });
        raiz.querySelectorAll('[data-receber]').forEach(b => {
            b.addEventListener('click', e => {
                e.stopPropagation();
                const l = Store.find('lancamentos', b.dataset.receber);
                Store.update('lancamentos', l.id, { status: 'recebido', data: Store.dia(0) });
                UI.toast(UI.brl(l.valor) + ' na conta!');
                desenhar();
                App.atualizarBadges();
            });
        });
    }

    function editar(id, tipoNovo) {
        const l = id ? Store.find('lancamentos', id) : {
            tipo: tipoNovo, desc: '', marca: '', valor: '', data: Store.dia(0),
            status: tipoNovo === 'saida' ? 'recebido' : 'previsto',
            categoria: tipoNovo === 'saida' ? 'Ferramenta' : 'Publi'
        };
        const entrada = l.tipo === 'entrada';
        const marcas = Store.lista('marcas').map(m => m.nome).filter((v, i, a) => a.indexOf(v) === i);

        UI.modal({
            titulo: id ? 'Editar lançamento' : (entrada ? 'Nova entrada' : 'Novo gasto'),
            sub: entrada ? 'Todo dinheiro que entra, mesmo o pequeno' : 'Todo custo do seu trabalho conta',
            corpo: `
                ${UI.campo('Descrição', UI.input('desc', l.desc, `placeholder="${entrada ? 'Ex: Reels da coleção de verão' : 'Ex: Assinatura do app de edição'}"`))}
                <div class="field-row">
                    ${entrada ? UI.campo('Marca', `<input class="input" name="marca" list="listaMarcasF" value="${UI.esc(l.marca)}">
                        <datalist id="listaMarcasF">${marcas.map(m => `<option value="${UI.esc(m)}">`).join('')}</datalist>`)
                        : UI.campo('Onde', UI.input('marca', l.marca, 'placeholder="Ex: Adobe"'))}
                    ${UI.campo('Valor', UI.input('valor', l.valor, 'type="number" min="0" step="10"'))}
                </div>
                <div class="field-row three">
                    ${UI.campo('Categoria', UI.select('categoria', entrada ? CATEGORIAS_ENTRADA : CATEGORIAS_SAIDA, l.categoria))}
                    ${UI.campo(entrada ? 'Data (ou previsão)' : 'Data', UI.input('data', l.data, 'type="date"'))}
                    ${UI.campo('Situação', UI.select('status', [
                        { v: 'previsto', t: entrada ? 'Ainda vou receber' : 'Ainda vou pagar' },
                        { v: 'recebido', t: entrada ? 'Já caiu na conta' : 'Já paguei' }
                    ], l.status))}
                </div>`,
            rodape: `
                ${id ? `<button class="btn btn-danger" data-apagar type="button">${UI.icon('lixo', 15)} Apagar</button>` : ''}
                <div class="spacer"></div>
                <button class="btn" data-fechar type="button">Cancelar</button>
                <button class="btn btn-primary" data-salvar type="button">Salvar</button>`,
            aoAbrir(o) {
                o.querySelector('[data-salvar]').addEventListener('click', () => {
                    const d = UI.lerForm(o.querySelector('.modal-body'));
                    if (!d.desc) { UI.toast('Escreve do que se trata', 'erro'); return; }
                    d.valor = Number(d.valor) || 0;
                    d.tipo = l.tipo;
                    if (id) Store.update('lancamentos', id, d);
                    else Store.add('lancamentos', d);
                    UI.fecharModal();
                    UI.toast('Lançado');
                    desenhar();
                    App.atualizarBadges();
                });
                const apagar = o.querySelector('[data-apagar]');
                if (apagar) apagar.addEventListener('click', () => {
                    Store.remove('lancamentos', id); UI.fecharModal(); desenhar(); UI.toast('Apagado');
                });
            }
        });
    }

    return {
        titulo: 'Financeiro',
        dica: 'Quanto entrou, quanto vem e quanto sobrou',
        render
    };
})();

</script>
<script>
/* js/views/conteudo.js */
/* ==========================================================================
   Conteúdo · da ideia solta até o post no ar
   ========================================================================== */

window.Views = window.Views || {};

Views.conteudo = (() => {

    const ETAPAS = [
        { id: 'ideia', nome: 'Ideia' },
        { id: 'roteiro', nome: 'Roteiro' },
        { id: 'gravar', nome: 'A gravar' },
        { id: 'editar', nome: 'Editando' },
        { id: 'postado', nome: 'Postado' }
    ];
    const FORMATOS = ['Reels', 'Carrossel', 'Stories', 'Foto', 'TikTok'];
    const PILARES = ['Nicho', 'Autoridade', 'Bastidor', 'Pessoal', 'Venda'];

    let raiz = null;
    let sub = 'quadro';
    let mesVisto = 0;

    function render(el) {
        raiz = el;
        desenhar();
    }

    function desenhar() {
        const itens = Store.lista('conteudos');
        const postadosMes = itens.filter(c => c.status === 'postado' && String(c.data || '').slice(0, 7) === Store.mes(0));
        const naGaveta = itens.filter(c => c.status === 'ideia');

        raiz.innerHTML = `
            <div class="stats stagger" style="margin-bottom:22px">
                <div class="stat">
                    <div class="stat-label">Postados neste mês</div>
                    <div class="stat-value">${postadosMes.length}</div>
                    <div class="stat-foot">constância vale mais que perfeição</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Ideias na gaveta</div>
                    <div class="stat-value">${naGaveta.length}</div>
                    <div class="stat-foot">${naGaveta.length < 5 ? 'abasteça, o bloqueio vem quando a gaveta esvazia' : 'gaveta cheia, pode gravar tranquila'}</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Em produção</div>
                    <div class="stat-value">${itens.filter(c => ['roteiro', 'gravar', 'editar'].includes(c.status)).length}</div>
                    <div class="stat-foot">roteiro, gravação e edição</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Equilíbrio dos pilares</div>
                    <div class="stat-value" style="font-size:16px;line-height:1.5;font-family:'DM Sans',sans-serif;font-weight:600;margin-top:9px">${equilibrio(itens)}</div>
                </div>
            </div>

            <div class="subnav">
                <button class="${sub === 'quadro' ? 'on' : ''}" data-sub="quadro" type="button">Quadro de produção</button>
                <button class="${sub === 'calendario' ? 'on' : ''}" data-sub="calendario" type="button">Calendário</button>
            </div>

            <div class="toolbar">
                <div style="margin-left:auto"></div>
                <button class="btn btn-primary" id="cNovo" type="button">${UI.icon('mais')} Nova ideia</button>
            </div>

            ${sub === 'quadro' ? quadro(itens) : calendario(itens)}
        `;

        ligar();
    }

    function equilibrio(itens) {
        const recentes = itens.filter(c => c.status === 'postado').slice(0, 10);
        if (!recentes.length) return '<span style="color:var(--muted);font-size:13px">poste pra ver</span>';
        const conta = {};
        recentes.forEach(c => { conta[c.pilar || 'Sem pilar'] = (conta[c.pilar || 'Sem pilar'] || 0) + 1; });
        return Object.entries(conta)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 3)
            .map(([p, n]) => `<span class="pill pill-accent" style="margin-right:4px">${UI.esc(p)} ${n}</span>`)
            .join('');
    }

    /* ---------- quadro ---------- */
    function quadro(itens) {
        return `<div class="board" id="cBoard">
            ${ETAPAS.map(et => {
                const lista = itens.filter(c => c.status === et.id);
                return `
                <section class="col" data-col="${et.id}">
                    <div class="col-head">
                        <h4>${et.nome}</h4>
                        <span class="col-count">${lista.length}</span>
                    </div>
                    <div class="col-body" data-drop="${et.id}">
                        ${lista.map(cartao).join('') || '<div style="padding:14px 4px;font-size:12.5px;color:var(--muted);text-align:center">Arraste pra cá</div>'}
                    </div>
                </section>`;
            }).join('')}
        </div>`;
    }

    function cartao(c) {
        const t = c.data ? UI.prazoTexto(c.data) : null;
        return `
            <article class="card" draggable="true" data-id="${c.id}">
                <div class="card-title">${UI.esc(c.titulo)}</div>
                <div class="card-foot">
                    <span class="pill">${UI.esc(c.formato || '')}</span>
                    ${c.pilar ? `<span class="pill pill-accent">${UI.esc(c.pilar)}</span>` : ''}
                    ${t && c.status !== 'postado' ? `<span class="pill ${t.tom ? 'pill-' + t.tom : ''}">${t.texto}</span>` : ''}
                    ${c.status === 'postado' && c.data ? `<span class="muted" style="font-size:11.5px">${UI.data(c.data)}</span>` : ''}
                </div>
            </article>`;
    }

    /* ---------- calendário ---------- */
    function calendario(itens) {
        const base = new Date();
        base.setDate(1);
        base.setMonth(base.getMonth() + mesVisto);
        const ano = base.getFullYear();
        const mes = base.getMonth();
        const primeiroDia = new Date(ano, mes, 1).getDay();
        const diasNoMes = new Date(ano, mes + 1, 0).getDate();
        const hojeIso = Store.dia(0);

        const porDia = {};
        itens.forEach(c => {
            if (!c.data) return;
            (porDia[c.data] = porDia[c.data] || []).push(c);
        });
        Store.lista('entregas').forEach(e => {
            if (!e.prazo || e.status === 'aprovado') return;
            (porDia[e.prazo] = porDia[e.prazo] || []).push({ titulo: '📦 ' + e.titulo, entrega: true, status: e.status });
        });

        const celulas = [];
        for (let i = 0; i < primeiroDia; i++) celulas.push('<div class="cal-day off"></div>');
        for (let d = 1; d <= diasNoMes; d++) {
            const iso = `${ano}-${String(mes + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const evs = porDia[iso] || [];
            celulas.push(`
                <div class="cal-day${iso === hojeIso ? ' today' : ''}">
                    <div class="cal-num">${d}</div>
                    ${evs.slice(0, 3).map(e => `
                        <div class="cal-ev ${e.entrega ? 'ev-warn' : e.status === 'postado' ? 'ev-ok' : ''}" title="${UI.esc(e.titulo)}">${UI.esc(e.titulo)}</div>`).join('')}
                    ${evs.length > 3 ? `<div style="font-size:10.5px;color:var(--muted);padding-left:2px">+${evs.length - 3}</div>` : ''}
                </div>`);
        }

        return `
            <div class="panel">
                <div class="panel-head">
                    <button class="icon-btn" data-mes="-1" type="button" style="transform:rotate(90deg)">${UI.icon('seta', 16)}</button>
                    <h3 style="min-width:170px;text-align:center">${UI.MESES[mes].charAt(0).toUpperCase() + UI.MESES[mes].slice(1)} de ${ano}</h3>
                    <button class="icon-btn" data-mes="1" type="button" style="transform:rotate(-90deg)">${UI.icon('seta', 16)}</button>
                    <div class="spacer"></div>
                    <span class="pill pill-accent">conteúdo</span>
                    <span class="pill pill-warn">entrega de marca</span>
                </div>
                <div class="panel-body">
                    <div class="cal">
                        ${['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'].map(d => `<div class="cal-dow">${d}</div>`).join('')}
                        ${celulas.join('')}
                    </div>
                </div>
            </div>`;
    }

    /* ---------- eventos ---------- */
    function ligar() {
        raiz.querySelectorAll('[data-sub]').forEach(b => {
            b.addEventListener('click', () => { sub = b.dataset.sub; desenhar(); });
        });
        raiz.querySelector('#cNovo').addEventListener('click', () => editar(null));

        raiz.querySelectorAll('[data-mes]').forEach(b => {
            b.addEventListener('click', () => { mesVisto += Number(b.dataset.mes); desenhar(); });
        });

        raiz.querySelectorAll('.card[data-id]').forEach(card => {
            card.addEventListener('click', () => {
                if (!card.classList.contains('dragging')) editar(card.dataset.id);
            });
            card.addEventListener('dragstart', e => {
                e.dataTransfer.setData('text/plain', card.dataset.id);
                setTimeout(() => card.classList.add('dragging'), 0);
            });
            card.addEventListener('dragend', () => card.classList.remove('dragging'));
        });

        raiz.querySelectorAll('[data-drop]').forEach(zona => {
            const col = zona.closest('.col');
            zona.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drop'); });
            zona.addEventListener('dragleave', e => { if (!zona.contains(e.relatedTarget)) col.classList.remove('drop'); });
            zona.addEventListener('drop', e => {
                e.preventDefault();
                col.classList.remove('drop');
                const id = e.dataTransfer.getData('text/plain');
                const item = Store.find('conteudos', id);
                if (!item || item.status === zona.dataset.drop) return;
                const campos = { status: zona.dataset.drop };
                if (zona.dataset.drop === 'postado' && UI.emDias(item.data) > 0) campos.data = Store.dia(0);
                Store.update('conteudos', id, campos);
                desenhar();
            });
        });
    }

    function editar(id) {
        const c = id ? Store.find('conteudos', id) : {
            titulo: '', formato: 'Reels', pilar: 'Nicho', status: 'ideia', data: Store.dia(3), roteiro: ''
        };
        UI.modal({
            titulo: id ? 'Editar conteúdo' : 'Nova ideia',
            sub: id ? '' : 'Anote agora, mesmo pela metade. Ideia não anotada some.',
            largo: true,
            corpo: `
                ${UI.campo('Ideia em uma frase', UI.input('titulo', c.titulo, 'placeholder="Ex: 3 erros que fazem a marca não te responder"'))}
                <div class="field-row three">
                    ${UI.campo('Formato', UI.select('formato', FORMATOS, c.formato))}
                    ${UI.campo('Pilar', UI.select('pilar', PILARES, c.pilar))}
                    ${UI.campo('Etapa', UI.select('status', ETAPAS.map(e => ({ v: e.id, t: e.nome })), c.status))}
                </div>
                ${UI.campo('Data prevista de postar', UI.input('data', c.data, 'type="date"'))}
                ${UI.campo('Roteiro', UI.textarea('roteiro', c.roteiro, 'style="min-height:150px" placeholder="Gancho (primeiros 3 segundos):&#10;&#10;Desenvolvimento:&#10;&#10;Fechamento e chamada:"'),
                    'Sem roteiro pronto você grava 8 vezes. Com roteiro, grava 2.')}`,
            rodape: `
                ${id ? `<button class="btn btn-danger" data-apagar type="button">${UI.icon('lixo', 15)} Apagar</button>` : ''}
                <div class="spacer"></div>
                <button class="btn" data-fechar type="button">Cancelar</button>
                <button class="btn btn-primary" data-salvar type="button">${id ? 'Salvar' : 'Adicionar'}</button>`,
            aoAbrir(o) {
                o.querySelector('[data-salvar]').addEventListener('click', () => {
                    const d = UI.lerForm(o.querySelector('.modal-body'));
                    if (!d.titulo) { UI.toast('Escreve a ideia primeiro', 'erro'); return; }
                    if (id) Store.update('conteudos', id, d);
                    else Store.add('conteudos', d);
                    UI.fecharModal();
                    UI.toast(id ? 'Salvo' : 'Ideia guardada');
                    desenhar();
                });
                const apagar = o.querySelector('[data-apagar]');
                if (apagar) apagar.addEventListener('click', () => {
                    UI.fecharModal();
                    UI.confirmar({
                        titulo: 'Apagar essa ideia?', texto: 'Não dá pra desfazer.',
                        aoConfirmar() { Store.remove('conteudos', id); desenhar(); UI.toast('Apagada'); }
                    });
                });
            }
        });
    }

    return {
        titulo: 'Conteúdo',
        dica: 'Da ideia solta até o post no ar',
        render
    };
})();

</script>
<script>
/* js/views/numeros.js */
/* ==========================================================================
   Instagram · os números que a marca pede antes de fechar
   ========================================================================== */

window.Views = window.Views || {};

Views.numeros = (() => {

    let raiz = null;

    function render(el) {
        raiz = el;
        desenhar();
    }

    function desenhar() {
        const hist = Store.lista('historicoIg').slice().sort((a, b) => String(a.mes).localeCompare(String(b.mes)));
        const posts = Store.lista('postsIg').slice().sort((a, b) => String(b.data).localeCompare(String(a.data)));
        const atual = hist[hist.length - 1] || {};
        const anterior = hist[hist.length - 2] || {};
        const cresceu = (atual.seguidores || 0) - (anterior.seguidores || 0);
        const pctCresc = anterior.seguidores ? ((cresceu / anterior.seguidores) * 100).toFixed(1).replace('.', ',') : '0';

        raiz.innerHTML = `
            <div class="stats stagger" style="margin-bottom:22px">
                <div class="stat">
                    <div class="stat-label">Seguidores</div>
                    <div class="stat-value">${UI.compacto(atual.seguidores)}</div>
                    <div class="stat-foot">${cresceu >= 0 ? `<span class="up">+${UI.numero(cresceu)}</span>` : `<span class="down">${UI.numero(cresceu)}</span>`} no último mês (${pctCresc}%)</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Alcance no mês</div>
                    <div class="stat-value">${UI.compacto(atual.alcance)}</div>
                    <div class="stat-foot">contas diferentes que te viram</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Engajamento</div>
                    <div class="stat-value">${String(atual.engajamento || 0).replace('.', ',')}<small>%</small></div>
                    <div class="stat-foot">${Number(atual.engajamento) >= 3 ? 'acima da média do mercado, use isso na proposta' : 'a média de mercado fica entre 2% e 4%'}</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Salvamentos</div>
                    <div class="stat-value">${UI.compacto(atual.salvamentos)}</div>
                    <div class="stat-foot">o número que mais impressiona marca</div>
                </div>
            </div>

            <div class="toolbar">
                <div>
                    <h2 class="serif" style="font-size:19px">Sua evolução</h2>
                    <p style="margin:2px 0 0;font-size:13px;color:var(--soft)">Atualize uma vez por mês. Leva dois minutos e vale ouro na hora de negociar.</p>
                </div>
                <div style="margin-left:auto"></div>
                <button class="btn" id="nPost" type="button">${UI.icon('mais', 15)} Registrar post</button>
                <button class="btn btn-primary" id="nMes" type="button">${UI.icon('grafico', 15)} Fechar o mês</button>
            </div>

            <div class="grid g2" style="align-items:start;margin-bottom:22px">
                <section class="panel">
                    <div class="panel-head"><h3>Seguidores que você ganhou por mês</h3></div>
                    <div class="panel-body">
                        ${hist.length > 1 ? UI.barras(hist.slice(1).map((h, i) => ({
                            rotulo: UI.data(h.mes + '-01', 'mes').split('/')[0],
                            valor: Math.max(0, (h.seguidores || 0) - (hist[i].seguidores || 0)),
                            suave: i === hist.length - 2
                        })), { formato: 'compacto' }) : UI.vazio('Sem histórico', 'Registre o fechamento de pelo menos dois meses pra ver a evolução.')}
                        <p style="margin:14px 0 0;font-size:12.5px;color:var(--muted)">
                            O total de seguidores está lá em cima. Aqui é o que entrou de novo em cada mês, que é o que mostra se você está crescendo ou parada.
                        </p>
                    </div>
                </section>
                <section class="panel">
                    <div class="panel-head"><h3>Alcance por mês</h3></div>
                    <div class="panel-body">
                        ${hist.length ? UI.barras(hist.map((h, i) => ({
                            rotulo: UI.data(h.mes + '-01', 'mes').split('/')[0],
                            valor: h.alcance,
                            suave: i === hist.length - 1
                        })), { formato: 'compacto' }) : UI.vazio('Sem histórico', 'Registre o fechamento do primeiro mês.')}
                        <p style="margin:14px 0 0;font-size:12.5px;color:var(--muted)">O mês atual aparece mais claro porque ainda não fechou.</p>
                    </div>
                </section>
            </div>

            ${leitura(hist, posts)}

            <section class="section" style="margin-top:22px">
                <div class="section-head">
                    <div>
                        <h2>Seus posts</h2>
                        <p>O que rendeu mais e o que virou parceria. Isso vira argumento na proposta.</p>
                    </div>
                </div>
                <div class="panel">
                    <div class="panel-body flush">
                        ${posts.length ? `
                        <div class="table-wrap">
                            <table class="data">
                                <thead>
                                    <tr>
                                        <th>Post</th>
                                        <th>Formato</th>
                                        <th class="num">Alcance</th>
                                        <th class="num">Salvos</th>
                                        <th class="num">Comentários</th>
                                        <th class="num">Compart.</th>
                                        <th>Rendeu marca?</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${posts.map(p => `
                                        <tr class="clickable" data-post="${p.id}">
                                            <td>
                                                <div class="cell-title">${UI.esc(p.titulo)}</div>
                                                <div class="cell-sub">${UI.data(p.data)}</div>
                                            </td>
                                            <td><span class="pill">${UI.esc(p.formato)}</span></td>
                                            <td class="num">${UI.compacto(p.alcance)}</td>
                                            <td class="num">${UI.numero(p.salvos)}</td>
                                            <td class="num">${UI.numero(p.comentarios)}</td>
                                            <td class="num">${UI.numero(p.compart)}</td>
                                            <td>${p.virouMarca ? '<span class="pill pill-ok">Sim</span>' : '<span class="muted">não</span>'}</td>
                                            <td class="acts"><button class="icon-btn" data-apagar-post="${p.id}" type="button">${UI.icon('lixo', 15)}</button></td>
                                        </tr>`).join('')}
                                </tbody>
                            </table>
                        </div>` : UI.vazio('Nenhum post registrado',
                            'Registre os posts que foram bem. Quando a marca pedir números, você tem prova na mão em vez de printar na correria.')}
                    </div>
                </div>
            </section>
        `;
        ligar();
    }

    /** lê os dados e escreve uma conclusão em português, que é o que a aluna não sabe fazer sozinha */
    function leitura(hist, posts) {
        if (!posts.length) return '';
        const porFormato = {};
        posts.forEach(p => {
            const f = p.formato || 'Outro';
