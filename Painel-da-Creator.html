            porFormato[f] = porFormato[f] || { soma: 0, n: 0 };
            porFormato[f].soma += Number(p.alcance || 0);
            porFormato[f].n++;
        });
        const ranking = Object.entries(porFormato)
            .map(([f, d]) => ({ f, media: d.soma / d.n, n: d.n }))
            .sort((a, b) => b.media - a.media);
        const melhor = ranking[0];
        const campeao = posts.slice().sort((a, b) => (b.alcance || 0) - (a.alcance || 0))[0];
        const renderam = posts.filter(p => p.virouMarca);
        const maisSalvo = posts.slice().sort((a, b) => (b.salvos || 0) - (a.salvos || 0))[0];

        return `
            <section class="panel">
                <div class="panel-head"><h3>O que seus números estão dizendo</h3></div>
                <div class="panel-body">
                    <div class="grid g3">
                        <div>
                            <div class="eyebrow">Formato que mais alcança</div>
                            <div class="serif" style="font-size:20px;margin:6px 0 4px">${UI.esc(melhor.f)}</div>
                            <p style="margin:0;font-size:13px;color:var(--soft);line-height:1.55">
                                Média de ${UI.compacto(Math.round(melhor.media))} de alcance em ${melhor.n} ${melhor.n === 1 ? 'post' : 'posts'}. Faça mais desses.
                            </p>
                        </div>
                        <div>
                            <div class="eyebrow">Seu melhor conteúdo</div>
                            <div class="serif" style="font-size:20px;margin:6px 0 4px">${UI.compacto(campeao.alcance)}</div>
                            <p style="margin:0;font-size:13px;color:var(--soft);line-height:1.55">
                                "${UI.esc(campeao.titulo)}". Esse é o print que vai no seu mídia kit.
                            </p>
                        </div>
                        <div>
                            <div class="eyebrow">Conteúdo que trouxe marca</div>
                            <div class="serif" style="font-size:20px;margin:6px 0 4px">${renderam.length} de ${posts.length}</div>
                            <p style="margin:0;font-size:13px;color:var(--soft);line-height:1.55">
                                ${renderam.length ? 'Repare no que eles têm em comum. É esse tipo de post que a marca vê e te chama.' : 'Ainda nenhum. Poste mostrando produto em uso, é o que faz marca te achar.'}
                            </p>
                        </div>
                    </div>
                    ${maisSalvo ? `
                    <div class="note accent" style="margin-top:18px">
                        ${UI.icon('raio')}
                        <div><b>Use isso na próxima proposta:</b> seu post "${UI.esc(maisSalvo.titulo)}" teve ${UI.numero(maisSalvo.salvos)} salvamentos.
                        Salvamento é o número que mais convence marca, porque mostra que a pessoa quer voltar no conteúdo, não que só passou o dedo.</div>
                    </div>` : ''}
                </div>
            </section>`;
    }

    function ligar() {
        raiz.querySelector('#nMes').addEventListener('click', fecharMes);
        raiz.querySelector('#nPost').addEventListener('click', () => editarPost(null));
        raiz.querySelectorAll('[data-post]').forEach(tr => {
            tr.addEventListener('click', e => {
                if (e.target.closest('[data-apagar-post]')) return;
                editarPost(tr.dataset.post);
            });
        });
        raiz.querySelectorAll('[data-apagar-post]').forEach(b => {
            b.addEventListener('click', e => {
                e.stopPropagation();
                Store.remove('postsIg', b.dataset.apagarPost);
                desenhar();
                UI.toast('Post removido');
            });
        });
    }

    function fecharMes() {
        const mesAtual = Store.mes(0);
        const existente = Store.lista('historicoIg').find(h => h.mes === mesAtual) || {};
        UI.modal({
            titulo: 'Fechar ' + UI.MESES[new Date().getMonth()],
            sub: 'Pegue esses números no Instagram em Painel profissional',
            corpo: `
                <div class="field-row">
                    ${UI.campo('Seguidores hoje', UI.input('seguidores', existente.seguidores, 'type="number" min="0"'))}
                    ${UI.campo('Contas alcançadas no mês', UI.input('alcance', existente.alcance, 'type="number" min="0"'))}
                </div>
                <div class="field-row three">
                    ${UI.campo('Engajamento (%)', UI.input('engajamento', existente.engajamento, 'type="number" min="0" step="0.1"'))}
                    ${UI.campo('Posts publicados', UI.input('posts', existente.posts, 'type="number" min="0"'))}
                    ${UI.campo('Salvamentos', UI.input('salvamentos', existente.salvamentos, 'type="number" min="0"'))}
                </div>
                <div class="note info">
                    ${UI.icon('info')}
                    <div>No app do Instagram: toque em <b>Painel profissional</b>, depois em <b>Total de contas alcançadas</b> e troque o período para os últimos 30 dias.</div>
                </div>`,
            rodape: `<button class="btn" data-fechar type="button">Cancelar</button>
                     <button class="btn btn-primary" data-salvar type="button">Salvar o mês</button>`,
            aoAbrir(o) {
                o.querySelector('[data-salvar]').addEventListener('click', () => {
                    const d = UI.lerForm(o.querySelector('.modal-body'));
                    const dados = {
                        mes: mesAtual,
                        seguidores: Number(d.seguidores) || 0,
                        alcance: Number(d.alcance) || 0,
                        engajamento: Number(String(d.engajamento).replace(',', '.')) || 0,
                        posts: Number(d.posts) || 0,
                        salvamentos: Number(d.salvamentos) || 0
                    };
                    const hist = Store.lista('historicoIg');
                    const i = hist.findIndex(h => h.mes === mesAtual);
                    if (i > -1) hist[i] = dados; else hist.push(dados);
                    Store.setPerfil({ seguidores: dados.seguidores });
                    Store.save();
                    UI.fecharModal();
                    UI.toast('Mês registrado');
                    desenhar();
                });
            }
        });
    }

    function editarPost(id) {
        const p = id ? Store.find('postsIg', id) : {
            titulo: '', data: Store.dia(0), formato: 'Reels', alcance: '', salvos: '', comentarios: '', compart: '', virouMarca: false
        };
        UI.modal({
            titulo: id ? 'Editar post' : 'Registrar post',
            sub: 'Vale registrar os que foram bem e os que trouxeram marca',
            largo: true,
            corpo: `
                <div class="field-row">
                    ${UI.campo('Sobre o que era', UI.input('titulo', p.titulo, 'placeholder="Ex: Antes e depois da estante"'))}
                    ${UI.campo('Data', UI.input('data', p.data, 'type="date"'))}
                </div>
                <div class="field-row three">
                    ${UI.campo('Formato', UI.select('formato', ['Reels', 'Carrossel', 'Stories', 'Foto'], p.formato))}
                    ${UI.campo('Alcance', UI.input('alcance', p.alcance, 'type="number" min="0"'))}
                    ${UI.campo('Salvamentos', UI.input('salvos', p.salvos, 'type="number" min="0"'))}
                </div>
                <div class="field-row">
                    ${UI.campo('Comentários', UI.input('comentarios', p.comentarios, 'type="number" min="0"'))}
                    ${UI.campo('Compartilhamentos', UI.input('compart', p.compart, 'type="number" min="0"'))}
                </div>
                <label class="check" style="border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 14px">
                    <input type="checkbox" name="virouMarca" ${p.virouMarca ? 'checked' : ''}>
                    <span class="check-box">${UI.icon('check', 12)}</span>
                    <span class="check-text">Esse post trouxe contato de marca
                        <small>Marque quando alguma marca te chamar depois desse conteúdo. Esse é o post que você mostra pra vender.</small>
                    </span>
                </label>`,
            rodape: `${id ? '<button class="btn btn-danger" data-apagar type="button">Apagar</button>' : ''}
                     <div class="spacer"></div>
                     <button class="btn" data-fechar type="button">Cancelar</button>
                     <button class="btn btn-primary" data-salvar type="button">Salvar</button>`,
            aoAbrir(o) {
                o.querySelector('[data-salvar]').addEventListener('click', () => {
                    const d = UI.lerForm(o.querySelector('.modal-body'));
                    if (!d.titulo) { UI.toast('Escreve sobre o que era o post', 'erro'); return; }
                    ['alcance', 'salvos', 'comentarios', 'compart'].forEach(k => d[k] = Number(d[k]) || 0);
                    if (id) Store.update('postsIg', id, d);
                    else Store.add('postsIg', d);
                    UI.fecharModal();
                    UI.toast('Salvo');
                    desenhar();
                });
                const apagar = o.querySelector('[data-apagar]');
                if (apagar) apagar.addEventListener('click', () => {
                    Store.remove('postsIg', id); UI.fecharModal(); desenhar(); UI.toast('Apagado');
                });
            }
        });
    }

    return {
        titulo: 'Instagram',
        dica: 'Os números que a marca pede antes de fechar',
        render
    };
})();

</script>
<script>
/* js/views/checklist.js */
/* ==========================================================================
   Checklist Portfólio · o que precisa ter, referências de vídeo e roteiros
   ========================================================================== */

window.Views = window.Views || {};

Views.checklist = (() => {

    let raiz = null;
    let sub = 'checklist';
    let abertas = { capa: true };          // seções do checklist abertas
    let filtroEstilo = '';
    let filtroAudiencia = '';
    let busca = '';
    let nichoAberto = 'beleza';
    let tipoAberto = '';

    const CORES = ['terra', 'oliva', 'mostarda', 'coral', 'rosa', 'petroleo', 'musgo', 'areia'];

    function render(el) {
        raiz = el;
        desenhar();
    }

    function desenhar() {
        raiz.innerHTML = `
            <div class="subnav">
                <button class="${sub === 'checklist' ? 'on' : ''}" data-sub="checklist" type="button">✅ Checklist do portfólio</button>
                <button class="${sub === 'referencias' ? 'on' : ''}" data-sub="referencias" type="button">🎬 Referências de vídeo</button>
                <button class="${sub === 'roteiros' ? 'on' : ''}" data-sub="roteiros" type="button">📝 Roteiros</button>
                <button class="${sub === 'ideias' ? 'on' : ''}" data-sub="ideias" type="button">💡 Ideias por nicho</button>
                <button class="${sub === 'revisao' ? 'on' : ''}" data-sub="revisao" type="button">🔍 Revisar meu roteiro</button>
            </div>
            <div>${
                sub === 'checklist' ? abaChecklist() :
                sub === 'referencias' ? abaReferencias() :
                sub === 'roteiros' ? abaRoteiros() :
                sub === 'ideias' ? abaIdeias() : abaRevisao()
            }</div>`;
        ligar();
    }

    /* ======================================================================
       1. Checklist do portfólio
       ====================================================================== */
    const chaveCl = (secId, i) => `cl:${secId}:${i}`;
    const feitosDaSecao = sec => sec.itens.filter((_, i) => Store.marcado(chaveCl(sec.id, i))).length;

    function abaChecklist() {
        const total = Biblioteca.totalItensChecklist();
        const feitos = Biblioteca.CHECKLIST.reduce((n, s) => n + feitosDaSecao(s), 0);
        const pct = Math.round((feitos / total) * 100);
        const prontas = Biblioteca.CHECKLIST.filter(s => feitosDaSecao(s) === s.itens.length).length;

        return `
            <section class="placar dots">
                <div>
                    <div class="eyebrow">Seu portfólio está</div>
                    <div class="placar-num">${pct}<small>%</small></div>
                </div>
                <div class="placar-txt">
                    <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
                        <span class="count-chip"><b>${feitos}</b> de ${total} itens</span>
                        <span class="count-chip"><b>${prontas}</b> de ${Biblioteca.CHECKLIST.length} páginas prontas</span>
                    </div>
                    <p>${
                        pct === 100 ? '🎉 Está completo. Agora é mandar pra marca todo dia, sem medo.'
                        : pct >= 70 ? 'Já dá pra prospectar com ele. Termine o que falta enquanto manda pras marcas.'
                        : pct >= 30 ? 'Está saindo do papel. Foque na Capa e nos Melhores resultados, são as páginas que fecham contrato.'
                        : 'Comece pela Capa. Com ela e os seus melhores vídeos você já consegue o primeiro trabalho.'
                    }</p>
                </div>
                <div class="placar-barra">
                    <div class="progress" style="height:10px"><span style="width:${pct}%"></span></div>
                </div>
            </section>

            <div class="toolbar">
                <div>
                    <h2 class="serif" style="font-size:19px">As páginas do seu portfólio</h2>
                    <p style="margin:2px 0 0;font-size:13px;color:var(--soft)">Na ordem em que a marca vai ver. Clique em cada uma pra abrir.</p>
                </div>
                <div style="margin-left:auto"></div>
                <button class="btn btn-sm" data-cl-todas="abrir" type="button">Abrir todas</button>
                <button class="btn btn-sm" data-cl-todas="fechar" type="button">Fechar todas</button>
            </div>

            ${Biblioteca.CHECKLIST.map(secao).join('')}

            <div class="note accent" style="margin-top:20px">
                💾
                <div><b>Suas marcações ficam salvas.</b> Você pode fechar essa página, voltar amanhã e continuar de onde parou.</div>
            </div>`;
    }

    function secao(sec) {
        const feitos = feitosDaSecao(sec);
        const total = sec.itens.length;
        const completa = feitos === total;
        const aberta = !!abertas[sec.id];
        const raio = 15;
        const volta = 2 * Math.PI * raio;

        return `
            <section class="cl-sec${aberta ? ' aberta' : ''}${completa ? ' completa' : ''}" data-sec="${sec.id}">
                <button class="cl-head" data-abrir-sec="${sec.id}" type="button" aria-expanded="${aberta}">
                    <span class="cl-emoji">${sec.emoji}</span>
                    <span class="cl-tit">
                        <h3>${UI.esc(sec.nome)}</h3>
                        <p>${UI.esc(sec.resumo)}</p>
                    </span>
                    <span class="cl-progresso">
                        <span class="cl-fracao">${completa ? '✓ pronta' : feitos + '/' + total}</span>
                        <svg class="cl-anel" viewBox="0 0 36 36">
                            <circle class="trilho" cx="18" cy="18" r="${raio}"></circle>
                            <circle class="arco" cx="18" cy="18" r="${raio}"
                                stroke-dasharray="${volta}" stroke-dashoffset="${volta * (1 - feitos / total)}"></circle>
                        </svg>
                        <svg class="cl-seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                    </span>
                </button>
                <div class="cl-body">
                    <div class="cl-porque">💡 ${UI.esc(sec.porque)}</div>
                    <div class="check-list">
                        ${sec.itens.map((it, i) => `
                            <label class="check">
                                <input type="checkbox" data-marca="${chaveCl(sec.id, i)}" ${Store.marcado(chaveCl(sec.id, i)) ? 'checked' : ''}>
                                <span class="check-box">${UI.icon('check', 12)}</span>
                                <span class="check-text">${UI.esc(it.t)}<small>${UI.esc(it.d)}</small></span>
                            </label>`).join('')}
                    </div>
                </div>
            </section>`;
    }

    /* ======================================================================
       2. Referências de vídeo
       ====================================================================== */
    function todasReferencias() {
        const minhas = Store.lista('referencias').map(r => Object.assign({ minha: true }, r));
        return minhas.concat(Biblioteca.REFERENCIAS);
    }

    function abaReferencias() {
        const todas = todasReferencias();
        const termo = busca.trim().toLowerCase();
        const vistas = todas.filter(r => {
            if (filtroEstilo && r.estilo !== filtroEstilo) return false;
            if (filtroAudiencia && r.audiencia !== filtroAudiencia) return false;
            if (!termo) return true;
            return (r.titulo + ' ' + (r.gancho || '') + ' ' + (r.porque || '') + ' ' + (r.estilo || '')).toLowerCase().includes(termo);
        });

        const estilos = [...new Set(todas.map(r => r.estilo).filter(Boolean))];

        return `
            <section class="hero dots">
                <span class="hero-marca">🎬</span>
                <h2>Referências de vídeo</h2>
                <p>O UGC está cheio de vídeo igual: pessoa sentada na sala falando do produto. Aqui estão os formatos que fogem disso.
                   Assista, entenda a estrutura e grave a sua versão. É isso que vai deixar o seu portfólio diferente de todos os outros.</p>
                <div class="hero-foot">
                    <span class="count-chip"><b>${todas.length}</b> ${todas.length === 1 ? 'referência' : 'referências'}</span>
                    <span class="count-chip">${estilos.length} estilos diferentes</span>
                </div>
            </section>

            <div class="filtros">
                <div class="search">
                    ${UI.icon('busca')}
                    <input class="input" id="refBusca" placeholder="Buscar formato, gancho..." value="${UI.esc(busca)}">
                </div>
                ${dropdown('estilo', 'Estilo', filtroEstilo, [{ v: '', t: 'Todos os estilos' }].concat(estilos.map(e => ({ v: e, t: e }))))}
                ${dropdown('audiencia', 'Audiência', filtroAudiencia, [{ v: '', t: 'Todas' }].concat(Biblioteca.AUDIENCIAS))}
                <div style="margin-left:auto"></div>
                <button class="btn btn-primary" id="refNova" type="button">${UI.icon('mais')} Adicionar referência</button>
            </div>

            ${vistas.length ? `
                <div class="ref-grid">
                    ${vistas.map(cartaoRef).join('')}
                </div>` :
                UI.vazio('Nenhuma referência com esse filtro', 'Tente limpar a busca ou trocar o estilo.')}

            <div class="note info" style="margin-top:26px">
                ${UI.icon('info')}
                <div><b>Quer guardar suas próprias referências?</b> Use o botão "Adicionar referência" e cole o link de um reel que te inspirou,
                junto com o motivo pelo qual você acha que ele funcionou. Referência sem análise não ensina nada.</div>
            </div>`;
    }

    function cartaoRef(r) {
        const cor = r.cor || CORES[Math.abs(hash(r.id || r.titulo)) % CORES.length];
        const capa = capaDoCard(r);
        const reserva = capaReserva(r);
        // o emoji fica sempre por baixo: se a capa não carregar, ele reaparece sozinho
        return `
            <button class="ref-card c-${cor}" data-ref="${UI.esc(r.id)}" type="button">
                <div class="ref-capa capa-cat">
                    <span class="ref-emoji">${r.emoji || '🎬'}</span>
                    ${r.video ? `<video class="ref-midia" src="${UI.esc(r.video)}" muted playsinline preload="metadata"></video>`
                        : capa ? `<img class="ref-midia" src="${UI.esc(capa)}" alt="" loading="lazy" data-reserva="${UI.esc(reserva)}" onload="Views.checklist.conferirCapa(this)" onerror="Views.checklist.trocarCapa(this)">`
                        : ''}
                    <span class="ref-badge">${UI.esc(r.estilo || 'Referência')}</span>
                    ${r.duracao ? `<span class="ref-dur">${UI.esc(r.duracao)}</span>` : ''}
                    <span class="ref-play">
                        <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 21 12 6 21 6 3"/></svg>
                    </span>
                </div>
                <div class="ref-info">
                    <h4>${UI.esc(r.titulo)}</h4>
                    <p>${UI.esc(r.gancho || r.porque || '')}</p>
                    <div class="ref-tags">
                        <span class="pill pill-cat">${UI.esc(r.audiencia || 'Universal')}</span>
                        ${r.marca ? `<span class="pill">${UI.esc(r.marca)}</span>` : ''}
                        ${r.minha ? '<span class="pill">minha</span>' : ''}
                    </div>
                </div>
            </button>`;
    }

    function hash(s) {
        let h = 0;
        String(s).split('').forEach(c => { h = ((h << 5) - h) + c.charCodeAt(0); h |= 0; });
        return h;
    }

    /* ---------- vídeo: arquivo, YouTube ou Instagram ---------- */

    /** pega o id do YouTube em qualquer formato de link */
    function idYoutube(url) {
        const s = String(url || '');
        const m = s.match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{11})/);
        if (m) return m[1];
        return /^[A-Za-z0-9_-]{11}$/.test(s.trim()) ? s.trim() : '';
    }

    /** pega o código do post ou reel do Instagram */
    function codigoInsta(url) {
        const m = String(url || '').match(/instagram\.com\/(?:p|reel|reels|tv)\/([A-Za-z0-9_-]+)/);
        return m ? m[1] : '';
    }

    /** o que aparece na capa do card: capa própria, print do YouTube ou nada.
        oardefault é a versão na proporção original do vídeo, então Short vem
        em pé e sem as tarjas pretas que o hqdefault coloca dos lados. */
    function capaDoCard(r) {
        if (r.capa) return r.capa;
        const yt = idYoutube(r.youtube || r.link);
        return yt ? `https://i.ytimg.com/vi/${yt}/oardefault.jpg` : '';
    }

    /** nem todo vídeo tem oardefault: a fila tenta oar2 e por último a capa
        comum, que é 4:3 e tem tarja preta, mas pelo menos nunca falha */
    function capaReserva(r) {
        if (r.capa) return '';
        const yt = idYoutube(r.youtube || r.link);
        if (!yt) return '';
        return [
            `https://i.ytimg.com/vi/${yt}/oar2.jpg`,
            `https://i.ytimg.com/vi/${yt}/hqdefault.jpg`
        ].join('|');
    }

    /** o player que vai dentro da ficha */
    function playerDaFicha(r) {
        if (r.video) {
            return `<video src="${UI.esc(r.video)}" controls playsinline style="width:100%;border-radius:14px;background:#000;max-height:62vh"></video>`;
        }
        const yt = idYoutube(r.youtube || r.link);
        if (yt) {
            // Short é vertical: player estreito e em pé, senão sobra tarja preta dos dois lados
            const curto = /\/shorts\//.test(String(r.youtube || r.link));
            const proporcao = curto ? '177.8%' : '56.25%';
            const largura = curto ? 'max-width:290px;margin:0 auto;' : '';
            return `<div style="${largura}position:relative;padding-top:${proporcao};border-radius:14px;overflow:hidden;background:#000">
                <iframe src="https://www.youtube-nocookie.com/embed/${yt}" title="${UI.esc(r.titulo)}"
                    style="position:absolute;inset:0;width:100%;height:100%;border:0"
                    allow="accelerometer; clipboard-write; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe>
            </div>`;
        }
        const ig = codigoInsta(r.instagram || r.link);
        if (ig) {
            return `<div style="display:flex;justify-content:center">
                <iframe src="https://www.instagram.com/p/${ig}/embed/captioned/" title="${UI.esc(r.titulo)}"
                    style="width:100%;max-width:400px;height:640px;border:1px solid var(--border);border-radius:14px;background:var(--surface)"
                    scrolling="no" allowtransparency loading="lazy"></iframe>
            </div>`;
        }
        return '';
    }

    /** link pra abrir o original em outra aba */
    const linkExterno = r => r.link || r.instagram || r.youtube || '';

    function dropdown(nome, rotulo, valor, opcoes) {
        const atual = opcoes.find(o => o.v === valor) || opcoes[0];
        return `
            <div class="dd" data-dd="${nome}">

                    <span class="dd-rotulo">${rotulo}:</span>
                    <span>${UI.esc(atual.t)}</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                <div class="dd-menu">
                    ${opcoes.map(o => `
                        <button class="dd-item${o.v === valor ? ' on' : ''}" data-dd-val="${UI.esc(o.v)}" type="button">
                            ${UI.esc(o.t)}
                            <svg class="dd-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                        </button>`).join('')}

    }

    /* ---------- ficha da referência ---------- */
    function abrirRef(id) {
        const r = todasReferencias().find(x => String(x.id) === String(id));
        if (!r) return;
        const cor = r.cor || CORES[Math.abs(hash(r.id || r.titulo)) % CORES.length];
        const player = playerDaFicha(r);
        const externo = linkExterno(r);

        const roteiroHtml = Array.isArray(r.roteiro)
            ? r.roteiro.map(b => `<div class="beat"><div class="beat-when">${UI.esc(b.t)}</div><div class="beat-what">${b.o}</div></div>`).join('')
            : (r.roteiro ? `<p style="margin:0;white-space:pre-wrap;font-size:14px;line-height:1.65">${UI.esc(r.roteiro)}</p>` : '');

        UI.modal({
            titulo: (r.emoji || '🎬') + '  ' + r.titulo,
            sub: [r.marca ? 'Campanha ' + r.marca : '', r.estilo, r.duracao].filter(Boolean).join(' · '),
            largo: true,
            corpo: `
                <div class="c-${cor} ${player ? 'ficha-2col' : ''}">
                    <div class="${player ? 'ficha-video' : ''}">
                        ${player || `
                            <div class="ficha-capa capa-cat">
                                ${r.capa ? `<img src="${UI.esc(r.capa)}" alt="">` : `<span class="ref-emoji">${r.emoji || '🎬'}</span>`}
                            </div>`}
                        ${externo ? `<a class="btn ${player ? 'btn-sm' : 'btn-primary'}" href="${UI.esc(externo)}" target="_blank" rel="noopener" style="margin-top:12px">${UI.icon('link', 15)} Abrir no YouTube</a>` : ''}
                    </div>

                    <div>
                        ${r.gancho ? `
                            <div class="note accent" style="margin:0 0 18px">
                                🪝
                                <div><b>O gancho:</b> ${UI.esc(r.gancho)}</div>
                            </div>` : ''}

                        ${roteiroHtml ? `
                            <div class="eyebrow" style="margin-bottom:4px">Como esse vídeo é montado</div>
                            <div style="margin-bottom:20px">${roteiroHtml}</div>` : ''}

                        ${r.porque ? `<div class="ficha-linha"><div class="ficha-rot">Por que funcionou</div><div class="ficha-val">${UI.esc(r.porque)}</div></div>` : ''}
                        ${r.diferencial ? `<div class="ficha-linha"><div class="ficha-rot">O diferencial</div><div class="ficha-val">${UI.esc(r.diferencial)}</div></div>` : ''}
                        ${r.erro ? `<div class="ficha-linha"><div class="ficha-rot">Erro comum</div><div class="ficha-val">${UI.esc(r.erro)}</div></div>` : ''}
                    </div>
                </div>`,
            rodape: `
                ${r.minha ? `<button class="btn btn-danger" data-apagar-ref type="button">${UI.icon('lixo', 15)} Apagar</button>` : ''}
                <div class="spacer"></div>
                ${Array.isArray(r.roteiro) ? `<button class="btn" data-copiar-ref type="button">${UI.icon('copiar', 15)} Copiar o roteiro</button>` : ''}
                <button class="btn btn-primary" data-criar-ref type="button">${UI.icon('mais', 15)} Gravar a minha versão</button>`,
            aoAbrir(o) {
                const copiar = o.querySelector('[data-copiar-ref]');
                if (copiar) copiar.addEventListener('click', () => {
                    UI.copiar(textoDoRoteiro(r), 'Roteiro copiado, agora adapta pro seu produto');
                });

                o.querySelector('[data-criar-ref]').addEventListener('click', () => {
                    Store.add('conteudos', {
                        titulo: 'Minha versão: ' + r.titulo,
                        formato: 'Reels',
                        pilar: 'Nicho',
                        status: 'roteiro',
                        data: Store.dia(4),
                        roteiro: textoDoRoteiro(r)
                    });
                    UI.fecharModal();
                    UI.toast('Foi pro seu quadro de conteúdo');
                    App.atualizarBadges();
                });

                const apagar = o.querySelector('[data-apagar-ref]');
                if (apagar) apagar.addEventListener('click', () => {
                    UI.fecharModal();
                    UI.confirmar({
                        titulo: 'Apagar essa referência?',
                        texto: 'Ela sai da sua biblioteca. As referências da Lara continuam.',
                        aoConfirmar() { Store.remove('referencias', r.id); desenhar(); UI.toast('Apagada'); }
                    });
                });
            }
        });
    }

    function textoDoRoteiro(r) {
        const linhas = [(r.emoji || '') + ' ' + r.titulo];
        if (r.duracao) linhas.push('Duração ideal: ' + r.duracao);
        if (r.gancho) linhas.push('', 'GANCHO: ' + r.gancho);
        if (Array.isArray(r.roteiro)) {
            linhas.push('', 'ESTRUTURA:');
            r.roteiro.forEach(b => linhas.push(`[${b.t}] ${limpar(b.o)}`));
        } else if (r.roteiro) {
            linhas.push('', r.roteiro);
        }
        if (r.porque) linhas.push('', 'POR QUE FUNCIONA: ' + r.porque);
        if (r.erro) linhas.push('', 'CUIDADO COM: ' + r.erro);
        return linhas.join('\n');
    }

    /* ======================================================================

       ====================================================================== */
    function ligar() {
        raiz.querySelectorAll('[data-sub]').forEach(b => {
            b.addEventListener('click', () => { sub = b.dataset.sub; desenhar(); window.scrollTo({ top: 0 }); });
        });

        raiz.querySelectorAll('[data-marca]').forEach(cb => {
            cb.addEventListener('change', () => {
                Store.marcar(cb.dataset.marca, cb.checked);
                desenhar();
            });
        });

        /* checklist */
        raiz.querySelectorAll('[data-abrir-sec]').forEach(b => {
            b.addEventListener('click', () => {
                const id = b.dataset.abrirSec;
                abertas[id] = !abertas[id];
                desenhar();
            });
        });
        raiz.querySelectorAll('[data-cl-todas]').forEach(b => {
            b.addEventListener('click', () => {
                abertas = {};
                if (b.dataset.clTodas === 'abrir') Biblioteca.CHECKLIST.forEach(s => abertas[s.id] = true);
                desenhar();
            });
        });

        /* referências */
        const buscaEl = raiz.querySelector('#refBusca');
        if (buscaEl) buscaEl.addEventListener('input', e => {
            busca = e.target.value;
            const pos = e.target.selectionStart;
            desenhar();
            const novo = raiz.querySelector('#refBusca');
            if (novo) { novo.focus(); novo.setSelectionRange(pos, pos); }
        });

        raiz.querySelectorAll('[data-dd]').forEach(dd => {
            dd.querySelector('[data-dd-btn]').addEventListener('click', e => {
                e.stopPropagation();
                const jaAberto = dd.classList.contains('aberto');
                raiz.querySelectorAll('[data-dd]').forEach(d => d.classList.remove('aberto'));
                dd.classList.toggle('aberto', !jaAberto);
            });
            dd.querySelectorAll('[data-dd-val]').forEach(item => {
                item.addEventListener('click', () => {
                    const v = item.dataset.ddVal;
                    if (dd.dataset.dd === 'estilo') filtroEstilo = v;
                    else filtroAudiencia = v;
                    desenhar();
                });
            });
        });
        document.addEventListener('click', fecharDropdowns);

        raiz.querySelectorAll('[data-ref]').forEach(c => {
            c.addEventListener('click', () => abrirRef(c.dataset.ref));
        });

        const nova = raiz.querySelector('#refNova');
        if (nova) nova.addEventListener('click', novaReferencia);

        /* roteiros */
        raiz.querySelectorAll('[data-abrir-tipo]').forEach(b => {
            b.addEventListener('click', () => {
                tipoAberto = tipoAberto === b.dataset.abrirTipo ? '' : b.dataset.abrirTipo;
                desenhar();
            });
        });
        raiz.querySelectorAll('[data-copiar-tipo]').forEach(b => {
            b.addEventListener('click', () => {
                const t = Biblioteca.tipoPorId(b.dataset.copiarTipo);
                UI.copiar([
                    'ROTEIRO · ' + t.nome,
                    'Duração ideal: ' + t.duracao, '',
                    ...t.beats.map(x => `[${x.t}] ${limpar(x.o)}`), '',
                    'CUIDADO COM:', ...t.erros.map(e => '· ' + e)
                ].join('\n'), 'Esqueleto copiado, agora é preencher');
            });
        });
        raiz.querySelectorAll('[data-criar-tipo]').forEach(b => {
            b.addEventListener('click', () => {
                const t = Biblioteca.tipoPorId(b.dataset.criarTipo);
                Store.add('conteudos', {
                    titulo: t.nome, formato: 'Reels', pilar: 'Nicho', status: 'roteiro',
                    data: Store.dia(4),
                    roteiro: t.beats.map(x => `[${x.t}] ${limpar(x.o)}`).join('\n\n')
                });
                UI.toast('Criado no seu quadro de conteúdo');
                App.atualizarBadges();
            });
        });

        /* ideias */
        raiz.querySelectorAll('[data-nicho]').forEach(b => {
            b.addEventListener('click', () => { nichoAberto = b.dataset.nicho; desenhar(); });
        });
        raiz.querySelectorAll('[data-ver-tipo]').forEach(b => {
            b.addEventListener('click', () => {
                tipoAberto = b.dataset.verTipo;
                sub = 'roteiros';
                desenhar();
                const alvo = raiz.querySelector(`[data-tipo="${tipoAberto}"]`);
                if (alvo) alvo.scrollIntoView({ behavior: 'smooth', block: 'center' });
            });
        });
        raiz.querySelectorAll('[data-criar-ideia]').forEach(b => {
            b.addEventListener('click', () => {
                const [nid, idx] = b.dataset.criarIdeia.split(':');
                const nicho = Biblioteca.NICHOS.find(n => n.id === nid);
                const ideia = nicho.ideias[Number(idx)];
                const tipo = Biblioteca.tipoPorId(ideia.tipo);
                Store.add('conteudos', {
                    titulo: ideia.t, formato: 'Reels', pilar: 'Nicho', status: 'ideia',
                    data: Store.dia(5),
                    roteiro: `Gancho: ${ideia.gancho}\n\n` + (tipo ? tipo.beats.map(x => `[${x.t}] ${limpar(x.o)}`).join('\n\n') : '')
                });
                UI.toast('"' + ideia.t + '" foi pro seu quadro');
                App.atualizarBadges();
            });
        });

        /* revisão */
        const zerar = raiz.querySelector('#clZerar');
        if (zerar) zerar.addEventListener('click', () => {
            UI.confirmar({
                titulo: 'Zerar a revisão?',
                texto: 'Desmarca todos os itens pra você usar a lista no próximo roteiro. O checklist do portfólio não é afetado.',
                botao: 'Zerar',
                aoConfirmar() {
                    Biblioteca.REVISAO.forEach((b, bi) => b.itens.forEach((_, ii) => Store.marcar(`rv:${bi}:${ii}`, false)));
                    desenhar();
                    UI.toast('Pronta pro próximo roteiro');
                }
            });
        });
    }

    function fecharDropdowns() {
        document.querySelectorAll('[data-dd]').forEach(d => d.classList.remove('aberto'));
    }

    const limpar = html => String(html).replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();

    /** Quando o vídeo não tem aquela versão da capa, o YouTube não devolve erro:
        devolve um cinza de 120x90. Então não basta ouvir o onerror, tem que
        conferir o tamanho do que chegou. */
    function conferirCapa(img) {
        if (img.naturalWidth && img.naturalWidth <= 120) trocarCapa(img);
    }

    /** capa não serviu: tenta a próxima da fila, e no fim some pra sobrar o emoji */
    function trocarCapa(img) {
        const fila = (img.dataset.reserva || '').split('|').filter(Boolean);
        const proxima = fila.shift();
        img.dataset.reserva = fila.join('|');
        if (proxima) img.src = proxima;
        else img.remove();
    }

    return {
        titulo: 'Checklist Portfólio',
        dica: 'O que precisa ter, referências e roteiros',
        render,
        trocarCapa,
        conferirCapa
    };
})();

</script>
<script>
/* js/views/mensagens.js */
/* ==========================================================================
   Mensagens · o texto pronto pra hora que dá branco
   ========================================================================== */

window.Views = window.Views || {};

Views.mensagens = (() => {

    const CATEGORIAS = ['Primeiro contato', 'Follow up', 'Negociação', 'Fechamento', 'Cobrança', 'Pós-entrega'];

    let raiz = null;
    let filtro = 'todas';

    function render(el) {
        raiz = el;
        desenhar();
    }

    function desenhar() {
        const todas = Store.lista('mensagens');
        const visiveis = filtro === 'todas' ? todas : todas.filter(m => m.categoria === filtro);

        raiz.innerHTML = `
            <div class="note accent" style="margin-bottom:20px">
                ${UI.icon('raio')}
                <div><b>Os campos entre colchetes já vêm preenchidos com seus dados</b> quando você copia.
                O que estiver faltando é porque você ainda não preencheu nas configurações.</div>
            </div>

            <div class="toolbar">
                <div class="chips">
                    <button class="chip${filtro === 'todas' ? ' on' : ''}" data-cat="todas" type="button">Todas</button>
                    ${CATEGORIAS.map(c => `<button class="chip${filtro === c ? ' on' : ''}" data-cat="${UI.esc(c)}" type="button">${c}</button>`).join('')}
                </div>
                <div style="margin-left:auto"></div>
                <button class="btn btn-primary" id="msNova" type="button">${UI.icon('mais')} Novo modelo</button>
            </div>

            ${visiveis.length ? `
                <div class="grid g2" style="align-items:start">
                    ${visiveis.map(cartao).join('')}
                </div>` :
                UI.vazio('Nenhum modelo nessa categoria', 'Crie o seu ou volte pra "Todas".')}
        `;
        ligar();
    }

    function cartao(m) {
        const preenchido = preencher(m.texto);
        return `
            <article class="snippet">
                <div class="snippet-head">
                    <div style="flex:1;min-width:0">
                        <span class="pill pill-accent">${UI.esc(m.categoria)}</span>
                        <h4 style="margin-top:7px">${UI.esc(m.titulo)}</h4>
                    </div>
                    <button class="icon-btn" data-editar="${m.id}" title="Editar" type="button">${UI.icon('lapis', 15)}</button>
                    <button class="btn btn-sm btn-primary" data-copiar="${m.id}" type="button">${UI.icon('copiar', 14)} Copiar</button>
                </div>
                <div class="snippet-body">${destacar(preenchido)}</div>
            </article>`;
    }

    /** troca os [CAMPOS] pelos dados dela quando já existem */
    function preencher(texto) {
        const p = Store.get().perfil;
        const mapa = {
            '[SEU NOME]': p.nome,
            '[SEU @]': p.arroba,
            '[SEU NICHO]': p.nicho ? p.nicho.toLowerCase() : '',
            '[SEU WHATSAPP]': p.whatsapp,
            '[SEU EMAIL]': p.email,
            '[X] mil seguidores': p.seguidores ? UI.compacto(p.seguidores) + ' seguidores' : '',
            '[MÊS]': UI.MESES[new Date().getMonth()]
        };
        let saida = texto;
        Object.entries(mapa).forEach(([k, v]) => {
            if (v) saida = saida.split(k).join(v);
        });
        return saida;
    }

    const destacar = texto => UI.esc(texto).replace(/\[([^\]]+)\]/g, '<span class="ph">[$1]</span>');

    function ligar() {
        raiz.querySelectorAll('[data-cat]').forEach(b => {
            b.addEventListener('click', () => { filtro = b.dataset.cat; desenhar(); });
        });
        raiz.querySelector('#msNova').addEventListener('click', () => editar(null));

        raiz.querySelectorAll('[data-copiar]').forEach(b => {
            b.addEventListener('click', () => {
                const m = Store.find('mensagens', b.dataset.copiar);
                UI.copiar(preencher(m.texto), 'Copiado. Agora troca o que está entre colchetes');
            });
        });
        raiz.querySelectorAll('[data-editar]').forEach(b => {
            b.addEventListener('click', () => editar(b.dataset.editar));
        });
    }

    function editar(id) {
        const m = id ? Store.find('mensagens', id) : { categoria: 'Primeiro contato', titulo: '', texto: '' };
        UI.modal({
            titulo: id ? 'Editar modelo' : 'Novo modelo',
            sub: 'Use [COLCHETES] no que muda a cada marca',
            largo: true,
            corpo: `
                <div class="field-row">
                    ${UI.campo('Quando usar', UI.select('categoria', CATEGORIAS, m.categoria))}
                    ${UI.campo('Nome do modelo', UI.input('titulo', m.titulo, 'placeholder="Ex: Cobrar retorno sem parecer chata"'))}
                </div>
                ${UI.campo('Texto', UI.textarea('texto', m.texto, 'style="min-height:240px;line-height:1.65"'),
                    'Dica: [SEU NOME], [SEU @], [SEU NICHO], [SEU WHATSAPP] e [MÊS] são preenchidos sozinhos quando você copia.')}`,
            rodape: `
                ${id ? `<button class="btn btn-danger" data-apagar type="button">${UI.icon('lixo', 15)} Apagar</button>` : ''}
                <div class="spacer"></div>
                <button class="btn" data-fechar type="button">Cancelar</button>
                <button class="btn btn-primary" data-salvar type="button">Salvar</button>`,
            aoAbrir(o) {
                o.querySelector('[data-salvar]').addEventListener('click', () => {
                    const d = UI.lerForm(o.querySelector('.modal-body'));
                    if (!d.titulo || !d.texto) { UI.toast('Falta o nome ou o texto', 'erro'); return; }
                    if (id) Store.update('mensagens', id, d);
                    else Store.add('mensagens', d);
                    UI.fecharModal();
                    UI.toast('Salvo');
                    desenhar();
                });
                const apagar = o.querySelector('[data-apagar]');
                if (apagar) apagar.addEventListener('click', () => {
                    UI.fecharModal();
                    UI.confirmar({
                        titulo: 'Apagar esse modelo?', texto: 'Não dá pra desfazer.',
                        aoConfirmar() { Store.remove('mensagens', id); desenhar(); UI.toast('Apagado'); }
                    });
                });
            }
        });
    }

    return {
        titulo: 'Mensagens',
        dica: 'Texto pronto pra hora que dá branco',
        render
    };
})();

</script>
<script>
/* js/views/config.js */

   ========================================================================== */

window.Views = window.Views || {};

Views.config = (() => {

        const s = Store.get();
        const totalItens = ['marcas', 'propostas', 'entregas', 'conteudos', 'lancamentos', 'postsIg']
            .reduce((t, k) => t + Store.lista(k).length, 0);
        const local = location.protocol === 'file:';   // rodando do computador dela

                            ${UI.campo('Cidade', UI.input('cidade', p.cidade, 'placeholder="São Paulo, SP"'))}
                        </div>
                        <div class="field-row">
                            ${UI.campo('E-mail de trabalho', UI.input('email', p.email, 'type="email"'))}
                            ${UI.campo('WhatsApp', UI.input('whatsapp', p.whatsapp, 'placeholder="(11) 99999-9999"'))}
                        </div>
                        ${UI.campo('Uma frase sobre o seu trabalho', UI.textarea('bio', p.bio, 'style="min-height:70px" placeholder="O que você faz e pra quem"'),
                            'Isso aparece na sua proposta. Escreva como você fala, não como currículo.')}
                        <div class="field-row">
                            ${UI.campo('Seguidores', UI.input('seguidores', p.seguidores, 'type="number" min="0"'))}
                            ${UI.campo('Meta de faturamento por mês', UI.input('metaMes', p.metaMes, 'type="number" min="0" step="100"'),
                                'Um número honesto. É ele que mede seu mês.')}
                        </div>
                        <button class="btn btn-primary" id="cfSalvar" type="button">Salvar meus dados</button>
                    </div>
                </section>

                <div>
                    <section class="panel" style="margin-bottom:16px">
                        <div class="panel-head"><h3>Minha tabela de preços</h3></div>
                        <div class="panel-body">
                            <p style="margin:0 0 16px;font-size:13.5px;color:var(--soft);line-height:1.6">
                                Esses valores viram sugestão automática quando você monta uma proposta.
                                Ter tabela é o que faz você parar de responder "quanto você paga?" e passar a dizer o seu número.
                            </p>
                            <div class="field-row">
                                ${UI.campo('1 Reels', UI.input('reels', c.reels, 'type="number" min="0" step="50"'))}
                                ${UI.campo('Sequência de stories', UI.input('stories', c.stories, 'type="number" min="0" step="50"'))}
                            </div>
                            <div class="field-row">
                                ${UI.campo('Pacote de fotos', UI.input('foto', c.foto, 'type="number" min="0" step="50"'))}
                                ${UI.campo('Combo reels + stories', UI.input('combo', c.combo, 'type="number" min="0" step="50"'))}
                            </div>
                            <div class="field-row">
                                ${UI.campo('Exclusividade', UI.input('exclusividade', c.exclusividade, 'type="number" min="0"'), '% a mais')}
                                ${UI.campo('Permissão de anúncio', UI.input('permissaoAds', c.permissaoAds, 'type="number" min="0"'), '% a mais')}
                            </div>
                            <button class="btn btn-primary" id="cfPreco" type="button">Salvar tabela</button>
                        </div>
                    </section>

                    ${local ? `
                    <section class="panel" style="margin-bottom:16px">
                        <div class="panel-body">
                            <div class="note ok" style="margin:0">
                                ${UI.icon('check')}
                                <div><b>Você está usando a sua cópia instalada.</b> O painel está rodando direto do seu computador,
                                então funciona mesmo sem internet. Só os vídeos das referências precisam de conexão.</div>
                            </div>
                        </div>
                    </section>` : `
                    <section class="panel" style="margin-bottom:16px">
                        <div class="panel-head"><h3>💻 Levar o painel pro seu computador</h3></div>
                        <div class="panel-body">
                            <p style="margin:0 0 15px;font-size:13.5px;color:var(--soft);line-height:1.6">
                                Baixe o painel como um arquivo só. Salve na área de trabalho, dê dois cliques e ele abre no navegador,
                                funcionando igualzinho e sem depender de internet.
                            </p>
                            <button class="btn btn-primary" id="cfBaixarApp" type="button">${UI.icon('baixar', 15)} Baixar o meu painel</button>
                            <p style="margin:12px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5">
                                Atenção: a cópia baixada guarda os dados dela separados desta página. Escolha um lugar e use sempre o mesmo.
                            </p>
                        </div>
                    </section>`}

                    <section class="panel">
                        <div class="panel-head"><h3>Seus dados e backup</h3></div>
                        <div class="panel-body">
                            <div class="note info" style="margin-bottom:16px">
                                ${UI.icon('info')}
                                <div>Tudo que você digita fica salvo <b>só neste navegador, neste computador</b>.
                                Nada é enviado pra lugar nenhum. Se você limpar o histórico do navegador ou trocar de máquina, os dados somem.
                                Por isso: <b>baixe um backup de vez em quando</b>.</div>
                            </div>

                            <div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px">
                                <button class="btn btn-primary" id="cfExportar" type="button">${UI.icon('baixar', 15)} Baixar backup</button>
                                <button class="btn" id="cfImportar" type="button">${UI.icon('subir', 15)} Restaurar de um backup</button>
                                <input type="file" id="cfArquivo" accept="application/json,.json" style="display:none">
                            </div>

                            <div style="padding-top:16px;border-top:1px solid var(--border)">
                                <div class="eyebrow" style="margin-bottom:8px">O que você já tem aqui dentro</div>
                                <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--soft)">
                                    <span><b style="color:var(--ink)">${Store.lista('marcas').length}</b> marcas</span>
                                    <span><b style="color:var(--ink)">${Store.lista('propostas').length}</b> propostas</span>
                                    <span><b style="color:var(--ink)">${Store.lista('entregas').length}</b> entregas</span>
                                    <span><b style="color:var(--ink)">${Store.lista('conteudos').length}</b> conteúdos</span>
                                    <span><b style="color:var(--ink)">${Store.lista('lancamentos').length}</b> lançamentos</span>
                                </div>
                            </div>

                            ${s.exemplo ? `
                                <div class="note" style="margin-top:18px">
                                    ${UI.icon('alerta')}
                                    <div><b>Você está vendo o painel de exemplo.</b> Os dados da Manu Ribeiro são fictícios, só pra você entender como cada tela funciona.
                                    Quando estiver pronta, limpe tudo e comece com os seus.</div>
                                </div>` : ''}

                            <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--border)">
                                <button class="btn" id="cfExemplo" type="button">Recarregar o exemplo</button>
                                <button class="btn btn-danger" id="cfZerar" type="button">${UI.icon('lixo', 15)} Limpar tudo e começar do zero</button>
                            </div>
                            <p style="margin:12px 0 0;font-size:12.5px;color:var(--muted);line-height:1.55">
                                ${totalItens} registros no total. Limpar apaga tudo e não tem volta, então baixe o backup antes.
                            </p>
                        </div>
                    </section>
                </div>
            </div>`;
        ligar();
    }

    function ligar() {
        raiz.querySelector('#cfSalvar').addEventListener('click', () => {
            const box = raiz.querySelector('.panel');
            const d = UI.lerForm(box);
            Store.setPerfil({
                nome: d.nome, arroba: d.arroba, nicho: d.nicho, cidade: d.cidade,
                email: d.email, whatsapp: d.whatsapp, bio: d.bio,
                seguidores: Number(d.seguidores) || 0,
                metaMes: Number(d.metaMes) || 0
            });
            UI.toast('Seus dados foram salvos');
            App.atualizarPerfil();
        });

        raiz.querySelector('#cfPreco').addEventListener('click', () => {
            const d = {};
            ['reels', 'stories', 'foto', 'combo', 'exclusividade', 'permissaoAds'].forEach(k => {
                const el = raiz.querySelector(`[name="${k}"]`);
                d[k] = Number(el ? el.value : 0) || 0;
            });
            Store.setPerfil({ cache: d });
            UI.toast('Tabela salva');
        });

        const baixarApp = raiz.querySelector('#cfBaixarApp');
        if (baixarApp) baixarApp.addEventListener('click', async () => {
            baixarApp.disabled = true;
            baixarApp.textContent = 'Baixando...';
            try {
                const r = await fetch('Painel-da-Creator.html', { cache: 'no-store' });
                if (!r.ok) throw new Error(r.status);
                const html = await r.text();
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
                a.download = 'Painel da Creator.html';
                a.click();
                setTimeout(() => URL.revokeObjectURL(a.href), 3000);
                UI.toast('Pronto! Salve na área de trabalho e dê dois cliques pra abrir');
            } catch (e) {
                UI.toast('Não consegui baixar agora, tenta de novo', 'erro');
            }
            desenhar();
        });

        raiz.querySelector('#cfExportar').addEventListener('click', () => {
            Store.exportar();
            UI.toast('Backup baixado. Guarde no Drive ou mande pra você mesma no WhatsApp');
        });

        const arquivo = raiz.querySelector('#cfArquivo');
        raiz.querySelector('#cfImportar').addEventListener('click', () => arquivo.click());
        arquivo.addEventListener('change', () => {
            const f = arquivo.files[0];
            if (!f) return;
            Store.importar(f)
                .then(() => { UI.toast('Backup restaurado'); App.recarregar(); })
                .catch(() => UI.toast('Esse arquivo não é um backup do painel', 'erro'));
        });

        raiz.querySelector('#cfExemplo').addEventListener('click', () => {
            UI.confirmar({
                titulo: 'Recarregar o exemplo?',
                texto: 'Isso apaga o que você digitou e volta pro painel da creator fictícia. Baixe um backup antes se tiver algo seu aqui.',
                botao: 'Recarregar exemplo',
                aoConfirmar() { Store.restaurarExemplo(); App.recarregar(); UI.toast('Exemplo recarregado'); }
            });
        });

        raiz.querySelector('#cfZerar').addEventListener('click', () => {
            UI.confirmar({
                titulo: 'Limpar tudo?',
                texto: 'Apaga marcas, propostas, entregas, conteúdos, lançamentos e números. Os modelos de mensagem continuam. Isso não tem volta.',
                botao: 'Sim, limpar tudo',
                aoConfirmar() { Store.zerar(); App.recarregar(); UI.toast('Painel zerado. Agora é seu.'); }
            });
        });
    }

    return {
        titulo: 'Configurações',
        dica: 'Seus dados, sua tabela e o backup',
        render
    };
})();

</script>
<script>
/* js/app.js */
/* ==========================================================================
   App · navegação e cola de tudo
   ========================================================================== */

const App = (() => {

    const ABAS = [
        { id: 'inicio', grupo: '', icone: 'casa', view: () => Views.inicio },
        { id: 'marcas', grupo: 'O dinheiro', icone: 'marcas', view: () => Views.marcas },
        { id: 'propostas', grupo: '', icone: 'proposta', view: () => Views.propostas },
        { id: 'entregas', grupo: '', icone: 'entrega', view: () => Views.entregas },
        { id: 'financeiro', grupo: '', icone: 'dinheiro', view: () => Views.financeiro },
        { id: 'conteudo', grupo: 'O conteúdo', icone: 'video', view: () => Views.conteudo },
        { id: 'numeros', grupo: '', icone: 'grafico', view: () => Views.numeros },
        { id: 'checklist', grupo: '', icone: 'check', view: () => Views.checklist },
        { id: 'mensagens', grupo: 'Apoio', icone: 'chat', view: () => Views.mensagens },
        { id: 'config', grupo: '', icone: 'config', view: () => Views.config }
    ];

    let atual = 'inicio';

    /* ---------- montagem ---------- */
    function iniciar() {
        Store.load();
        montarSidebar();
        atualizarPerfil();

        window.addEventListener('hashchange', () => {
            const alvo = location.hash.replace('#', '');
            if (alvo && alvo !== atual) ir(alvo, true);
        });

        document.getElementById('menuBtn').addEventListener('click', () => {
            document.body.classList.toggle('nav-open');
        });
        document.getElementById('scrim').addEventListener('click', () => {
            document.body.classList.remove('nav-open');
        });

        const inicial = location.hash.replace('#', '');
        ir(ABAS.some(a => a.id === inicial) ? inicial : 'inicio', true);
    }

    function montarSidebar() {
        const nav = document.getElementById('nav');
        let html = '';
        ABAS.forEach(a => {
            if (a.grupo) html += `<div class="nav-label">${a.grupo}</div>`;
            html += `
                <button class="nav-item" data-aba="${a.id}" type="button">
                    ${UI.icon(a.icone)}
                    <span>${a.view().titulo}</span>
                    <span class="nav-badge" data-badge="${a.id}" hidden></span>
                </button>`;
        });
        nav.innerHTML = html;

        nav.querySelectorAll('[data-aba]').forEach(b => {
            b.addEventListener('click', () => ir(b.dataset.aba));
        });
    }

    /* ---------- navegação ---------- */
    function ir(id, semHash) {
        const aba = ABAS.find(a => a.id === id);
        if (!aba) return;
        atual = id;
        if (!semHash) location.hash = id;
        else if (location.hash.replace('#', '') !== id) history.replaceState(null, '', '#' + id);

        document.querySelectorAll('[data-aba]').forEach(b => {
            b.classList.toggle('active', b.dataset.aba === id);
        });

        const v = aba.view();
        document.getElementById('pageTitle').textContent = v.titulo;
        document.getElementById('pageHint').textContent = v.dica || '';

        const palco = document.getElementById('view');
        palco.innerHTML = '';
        palco.className = 'view';
        v.render(palco);

        document.body.classList.remove('nav-open');
        window.scrollTo({ top: 0 });
        atualizarBadges();
    }

    /* ---------- avisos na lateral ---------- */
    function atualizarBadges() {
        const conta = {
            marcas: Store.lista('marcas').filter(m =>
                !['pago', 'perdida'].includes(m.status) && m.prazoRetorno && (UI.emDias(m.prazoRetorno) ?? 99) <= 0).length,
            entregas: Store.lista('entregas').filter(e =>
                e.status !== 'aprovado' && e.prazo && (UI.emDias(e.prazo) ?? 99) <= 1).length,
            propostas: Store.lista('propostas').filter(p =>
                p.status === 'enviada' && p.enviadaEm && Math.abs(UI.emDias(p.enviadaEm) || 0) >= 4).length,
            financeiro: Store.lista('lancamentos').filter(l =>
                l.tipo === 'entrada' && l.status === 'previsto' && (UI.emDias(l.data) ?? 99) < 0).length
        };

        document.querySelectorAll('[data-badge]').forEach(el => {
            const n = conta[el.dataset.badge] || 0;
            el.textContent = n;
            el.hidden = !n;
        });
    }

    function atualizarPerfil() {
        const p = Store.get().perfil;
        document.getElementById('meNome').textContent = p.nome || 'Sua conta';
        document.getElementById('meArroba').textContent = p.arroba || 'preencha seus dados';
        document.getElementById('meAvatar').textContent = UI.iniciais(p.nome || 'C');
    }

    function recarregar() {
        atualizarPerfil();
        ir(atual, true);
    }

    return { iniciar, ir, atualizarBadges, atualizarPerfil, recarregar, ABAS };
})();

document.addEventListener('DOMContentLoaded', App.iniciar);

</script>

</body>
</html>
